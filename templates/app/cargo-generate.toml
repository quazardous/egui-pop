[template]
cargo_generate_version = ">=0.21"
# The repository's own manifest (a workspace member) stays behind;
# `Cargo.toml.liquid` becomes the new application's `Cargo.toml`.
ignore = ["Cargo.toml"]
# Rust sources, the kit and the snapshots are copied as they are, never
# rendered.
exclude = ["src/**", "tests/**", "kit/**"]

[placeholders.egui_pop_version]
type = "string"
prompt = "Which egui-pop version?"
default = "0.8"

[placeholders.egui_version]
type = "string"
prompt = "Which egui version does that egui-pop use?"
default = "0.37"
