[package]
name = "egui-pop"
version = "0.1.0"
description = "Themable, accessible, agent-drivable application framework for egui: design tokens, plugins, commands and keymaps, menus, a command palette, dialogs, toasts, settings, parameter widgets (not an official egui crate)"
readme = "../../README.md"
keywords = ["egui", "gui", "widgets", "design-system", "accessibility"]
categories = ["gui"]
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[lints]
workspace = true

[features]
default = ["eframe", "phosphor"]
## Run applications through eframe (`App::run_native`, `eframe::App`).
eframe = ["egui-pop-api/eframe"]
## Icons drawn from the Phosphor icon font (MIT, about 480 KB); without
## it, icons are painted with lines and fills.
phosphor = ["egui-pop-api/phosphor"]
## The families a theme names (`font.family.ui`, `font.family.mono`)
## found among the system's fonts, not only among the faces the
## application registers (`egui_pop::core::fonts`).
system-fonts = ["egui-pop-api/system-fonts"]
## An application's own icons from SVG files (`egui_pop::core::icon_set`),
## nameable by a kit's glyphs.
svg = ["egui-pop-api/svg"]
## The image viewport, thumbnails and the histogram
## (`egui-pop-viewport`, re-exported as `egui_pop::viewport`).
viewport = ["dep:egui-pop-viewport"]
## The image tools' steps: the histogram's drag, curves, colour wheels,
## the zoom control and navigator, each change a step of the application
## (`egui-pop-imaging`, re-exported as `egui_pop::imaging`).
imaging = ["viewport", "dep:egui-pop-imaging"]
## Data views: a live tree, a list and a data table
## (`egui-pop-views`, re-exported as `egui_pop::views`).
views = ["dep:egui-pop-views"]
## Text and code editors, with syntect highlighting (`egui-pop-editors`,
## re-exported as `egui_pop::editors`).
editors = ["dep:egui-pop-editors", "egui-pop-editors/syntect"]
## The code editor's tree-sitter highlighter (compiles C).
editors-tree-sitter = ["editors", "egui-pop-editors/tree-sitter"]
## The terminal's pseudo-terminal source (a real shell; Unix PTYs,
## Windows ConPTY; not for the web).
editors-pty = ["editors", "egui-pop-editors/pty"]
## Translations over Fluent: catalogues, the language setting, locale
## formatting, the key extractor (`egui-pop-i18n`, re-exported as
## `egui_pop::i18n`).
i18n = ["dep:egui-pop-i18n"]
## Every platform service (`egui-pop-platform`, re-exported as
## `egui_pop::platform`); `platform-<service>` picks one.
platform = [
    "platform-instance",
    "platform-notify",
    "platform-tray",
    "platform-keys",
    "platform-logs",
    "platform-crash",
    "platform-focus",
]
## A single instance and deep links (`egui_pop::platform::instance`).
platform-instance = ["dep:egui-pop-platform", "egui-pop-platform/instance"]
## Desktop notifications with actions, falling back to toasts
## (`egui_pop::platform::notify`).
platform-notify = ["dep:egui-pop-platform", "egui-pop-platform/notify"]
## A tray icon with a declared menu (`egui_pop::platform::tray`).
platform-tray = ["dep:egui-pop-platform", "egui-pop-platform/tray"]
## Global shortcuts: system-scope bindings registered with the desktop
## (`egui_pop::platform::keys`).
platform-keys = ["dep:egui-pop-platform", "egui-pop-platform/keys"]
## Logs to a rotating file with a level setting
## (`egui_pop::platform::logs`).
platform-logs = ["dep:egui-pop-platform", "egui-pop-platform/logs"]
## Crash reports written by a panic hook and offered on the next start
## (`egui_pop::platform::crash`).
platform-crash = ["dep:egui-pop-platform", "egui-pop-platform/crash"]
## The window manager's focus mode read in-process
## (`egui_pop::platform::focus`).
platform-focus = ["dep:egui-pop-platform", "egui-pop-platform/focus"]
## The system's file chooser (through `rfd`: the xdg desktop portal on
## Linux); without it, the in-app picker.
native-dialogs = ["egui-pop-api/native-dialogs"]

[dependencies]
egui.workspace = true
egui-pop-tokens.workspace = true
egui-pop-model.workspace = true
egui-pop-core.workspace = true
egui-pop-api.workspace = true
egui-pop-viewport = { workspace = true, optional = true }
egui-pop-imaging = { workspace = true, optional = true }
egui-pop-i18n = { workspace = true, optional = true }
egui-pop-views = { workspace = true, optional = true }
egui-pop-editors = { workspace = true, optional = true }
egui-pop-platform = { workspace = true, optional = true }

[dev-dependencies]
egui = { workspace = true, features = ["default_fonts"] }
egui_kittest = { workspace = true, features = ["wgpu"] }
serde_json.workspace = true
egui-pop-test = { workspace = true, features = ["wgpu"] }

[[example]]
name = "minimal"
required-features = ["eframe"]
