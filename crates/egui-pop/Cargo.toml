[package]
name = "egui-pop"
version = "0.1.0"
description = "Themable, accessible, agent-drivable application framework for egui: design tokens, plugins, commands and keymaps, menus, a command palette, dialogs, toasts, settings, parameter widgets (not an official egui crate)"
readme = "../../README.md"
keywords = ["egui", "gui", "widgets", "design-system", "accessibility"]
categories = ["gui"]
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[lints]
workspace = true

[features]
default = ["eframe", "phosphor"]
## Run applications through eframe (`App::run_native`, `eframe::App`).
eframe = ["egui-pop-api/eframe"]
## Icons drawn from the Phosphor icon font (MIT, about 480 KB); without
## it, icons are painted with lines and fills.
phosphor = ["egui-pop-api/phosphor"]
## The image viewport, thumbnails and the histogram
## (`egui-pop-viewport`, re-exported as `egui_pop::viewport`).
viewport = ["dep:egui-pop-viewport"]
## Translations over Fluent: catalogues, the language setting, locale
## formatting, the key extractor (`egui-pop-i18n`, re-exported as
## `egui_pop::i18n`).
i18n = ["dep:egui-pop-i18n"]
## Every platform service (`egui-pop-platform`, re-exported as
## `egui_pop::platform`); `platform-<service>` picks one.
platform = ["platform-instance", "platform-notify", "platform-tray"]
## A single instance and deep links (`egui_pop::platform::instance`).
platform-instance = ["dep:egui-pop-platform", "egui-pop-platform/instance"]
## Desktop notifications with actions, falling back to toasts
## (`egui_pop::platform::notify`).
platform-notify = ["dep:egui-pop-platform", "egui-pop-platform/notify"]
## A tray icon with a declared menu (`egui_pop::platform::tray`).
platform-tray = ["dep:egui-pop-platform", "egui-pop-platform/tray"]

[dependencies]
egui.workspace = true
egui-pop-tokens.workspace = true
egui-pop-model.workspace = true
egui-pop-core.workspace = true
egui-pop-api.workspace = true
egui-pop-viewport = { workspace = true, optional = true }
egui-pop-i18n = { workspace = true, optional = true }
egui-pop-platform = { workspace = true, optional = true }

[dev-dependencies]
egui = { workspace = true, features = ["default_fonts"] }
egui_kittest = { workspace = true, features = ["wgpu"] }
serde_json.workspace = true
egui-pop-test = { workspace = true, features = ["wgpu"] }

[[example]]
name = "minimal"
required-features = ["eframe"]
