[package]
name = "egui-pop-fit"
version = "0.1.0"
description = "A slot layout engine with no egui dependency: dense grid packing of plain boxes in standard slot sizes, with forms, orientations, growth and hysteresis (formerly egui_fit)"
readme = "README.md"
keywords = ["layout", "grid", "packing", "gui"]
categories = ["gui", "algorithms"]
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true

[lints]
workspace = true

[features]
default = []
## `Serialize` and `Deserialize` for every public type.
serde = ["dep:serde"]

[dependencies]
serde = { workspace = true, optional = true }

[dev-dependencies]
proptest = "1"
