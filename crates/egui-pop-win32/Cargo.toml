[package]
name = "egui-pop-win32"
version = "0.2.0"
description = "The Windows layer of egui-pop's window frame: subclasses a window to answer WM_NCHITTEST from the frame's hit regions (Snap Layouts, Aero Snap) and asks Windows 11 for rounded corners, with no egui dependency"
readme = "README.md"
keywords = ["egui", "windows", "titlebar", "snap-layouts", "hit-test"]
categories = ["gui", "os::windows-apis"]
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true

# The workspace forbids `unsafe`; this crate is the one place that calls
# the Win32 API, so it only denies it and allows it in its `sys` module.
[lints.rust]
unsafe_code = "deny"
missing_debug_implementations = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }

[target.'cfg(windows)'.dependencies]
# MIT OR Apache-2.0: raw Win32 bindings.
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }
