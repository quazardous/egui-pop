[package]
name = "egui-pop-agent"
version = "0.14.0"
description = "Serves egui-pop's debug bridge out of the process, opt-in: JSON-RPC 2.0 over a private local socket (describe, snapshot, call, wait), for agents that drive a running application"
readme = "README.md"
keywords = ["egui", "agent", "json-rpc", "automation", "testing"]
categories = ["gui", "development-tools::testing"]
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true

[lints]
workspace = true

[dependencies]
egui.workspace = true
egui-pop-model.workspace = true
egui-pop-core.workspace = true
egui-pop-api.workspace = true
log.workspace = true
serde_json.workspace = true
# MIT OR Apache-2.0: the system's randomness, for pairing tokens.
getrandom = { version = "0.4", default-features = false }
# MIT OR Apache-2.0: pairing tokens are kept as their SHA-256.
sha2 = { version = "0.10", default-features = false }
# MIT OR Apache-2.0: egui's inspection protocol (Lucas Meurer and Emil
# Ernerfeldt, emilk/egui), served in the process for the `inspect` method;
# its TCP listener is never started.
egui_inspection = { workspace = true, features = ["plugin"] }
# MIT OR Apache-2.0: `inspect`'s screenshots travel as base64 in JSON.
base64 = { version = "0.22", default-features = false, features = ["alloc"] }

# Apache-2.0: the official MCP SDK, for the `mcp` feature.
rmcp = { version = "3.9", optional = true, default-features = false, features = ["server", "transport-io"] }
tokio = { version = "1", optional = true, default-features = false, features = ["rt", "io-std", "time"] }
# MIT OR Apache-2.0: Rerun's agent tools over egui_inspection (Lucas
# Meurer, Emil Ernerfeldt; rerun-io/egui_crates), served as the `widget_*`
# MCP tools over `inspect`; a temporary fork until upstream publishes it.
egui_inspection_tools = { workspace = true, optional = true }

[features]
# MCP over the socket: `egui_pop_agent::mcp` and the `egui-pop-agent-mcp`
# binary, tools generated from the application's `describe`.
mcp = ["dep:rmcp", "dep:tokio", "dep:egui_inspection_tools"]

[[bin]]
name = "egui-pop-agent-mcp"
path = "src/bin/egui-pop-agent-mcp.rs"
required-features = ["mcp"]

[target.'cfg(unix)'.dependencies]
# MIT: the socket peer's user (`SO_PEERCRED`, `getpeereid`) through a
# safe API (the workspace forbids `unsafe`).
nix = { version = "0.31", default-features = false, features = ["socket", "user"] }

[target.'cfg(windows)'.dependencies]
# MIT OR Apache-2.0: Windows named pipes through a safe API (the
# workspace forbids `unsafe`).
interprocess = { version = "2.4", default-features = false }
# MIT OR Apache-2.0: the pipe's security descriptor string (SDDL).
widestring = "1"

[dev-dependencies]
egui = { workspace = true, features = ["default_fonts"] }
egui-pop-api = { workspace = true, features = ["bundled-fonts"] }
egui-pop-test = { workspace = true, features = ["wgpu"] }
egui_kittest.workspace = true
# The crate itself with `mcp`, so the workspace's tests run the MCP tests.
egui-pop-agent = { path = ".", features = ["mcp"] }
tokio = { version = "1", features = ["rt", "io-util", "time"] }
