<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>egui-pop gallery</title>
    <!-- For Trunk (`trunk serve` in this directory). -->
    <link data-trunk rel="rust" data-bin="egui-pop-gallery" />
    <style>
      html, body { margin: 0; height: 100%; overflow: hidden; background: #1b1916; }
      #the_canvas_id { display: block; width: 100%; height: 100%; touch-action: none; }
      #failed { margin: 2em; color: #e8e2d9; font: 16px/1.5 sans-serif; white-space: pre-wrap; }
    </style>
  </head>
  <body>
    <canvas id="the_canvas_id"></canvas>
    <p id="failed" hidden></p>
    <noscript><p>The gallery needs JavaScript and WebAssembly.</p></noscript>
  </body>
</html>
