[package]
name = "egui-pop-gallery"
version = "0.0.0"
description = "The egui-pop gallery: every component in every variant, state, theme, density and accent"
publish = false
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[lints]
workspace = true

[features]
default = ["graph-png", "graph-pdf"]
## The node graph page exports PNG (`egui-pop/graph-png`).
graph-png = ["egui-pop/graph-png"]
## The node graph page exports PDF (`egui-pop/graph-pdf`).
graph-pdf = ["egui-pop/graph-pdf"]
## The system's file chooser in the gallery (tests always use the in-app
## picker, so this is off by default).
native-dialogs = ["egui-pop/native-dialogs"]
## The viewer page plays a clip it generates (`egui-pop/views-video`), through
## the system's GStreamer; off by default so that no build needs it.
## `cargo gallery` (xtask) turns it on when pkg-config finds GStreamer.
video = ["egui-pop/views-video"]
## The viewer page plays a YouTube video in a web view (`egui-pop/views-webview`),
## through the system's WebKitGTK; off by default so that no build needs it.
## `cargo gallery` (xtask) turns it on when pkg-config finds WebKitGTK.
webview = ["egui-pop/views-webview"]
## egui-pop's and egui's profiling scopes as `tracing` spans, for the
## `threading` example (docs/threading.md).
trace = ["dep:tracing", "dep:profiling", "profiling/profile-with-tracing"]

[[example]]
name = "threading"
required-features = ["trace"]

[dependencies]
egui-pop = { workspace = true, features = ["viewport", "graph-yaml", "imaging", "views", "views-markdown", "views-html", "editors", "i18n", "platform"] }
egui = { workspace = true, features = ["default_fonts"] }
# `persistence`: the folds, the sections and the layout survive a restart.
eframe = { workspace = true, features = ["default_fonts", "wgpu", "accesskit", "wayland", "x11", "links", "persistence", "clipboard"] }
serde_json.workspace = true
# The files page's demo images, drawn and encoded at start.
image = { workspace = true, features = ["png", "jpeg"] }
profiling = { workspace = true, optional = true }
# MIT: the spans the `threading` example measures.
tracing = { version = "0.1", optional = true }

# A shell in the terminal page, on the desktop.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
egui-pop = { workspace = true, features = ["editors-pty"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen-futures = "0.4"
log.workspace = true

[dev-dependencies]
egui_kittest = { workspace = true, features = ["eframe", "wgpu", "snapshot"] }
egui-pop-test = { workspace = true, features = ["wgpu"] }
