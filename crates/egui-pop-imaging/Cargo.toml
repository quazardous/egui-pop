[package]
name = "egui-pop-imaging"
version = "0.2.0"
description = "The image tools of egui-pop in an application: the histogram's drag, the curve editor, the colour wheels and the zoom control and navigator, and the node graph editor, each finished change a step an application can veto, redirect, replace or follow"
readme = "README.md"
keywords = ["egui", "histogram", "curves", "color-grading", "navigator"]
categories = ["gui", "multimedia::images"]
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true

[lints]
workspace = true

[features]
## `graph.export` writes PNG (`format: "png"`), base64-encoded.
graph-png = ["egui-pop-viewport/graph-png", "dep:base64"]
## `graph.export` writes PDF (`format: "pdf"`), base64-encoded.
graph-pdf = ["egui-pop-viewport/graph-pdf", "dep:base64"]

[dependencies]
egui-pop-model.workspace = true
egui-pop-api.workspace = true
egui-pop-viewport.workspace = true
egui.workspace = true
serde_json.workspace = true
# MIT OR Apache-2.0, already in the tree: `graph.export`'s PNG and PDF
# as text.
base64 = { version = "0.22", optional = true }
