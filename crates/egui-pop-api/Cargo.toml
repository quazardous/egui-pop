[package]
name = "egui-pop-api"
version = "0.1.0"
description = "The application API of egui-pop: plugins that own what they register, an app builder over eframe (or headless), zones and blocks, hooks, services and gallery stories"
keywords = ["egui", "gui", "plugins", "framework", "application"]
categories = ["gui"]
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[lints]
workspace = true

[features]
default = ["eframe"]
## Run applications in a native window or a browser through eframe.
eframe = ["dep:eframe"]
## The system's file chooser for path fields (rfd); without it, the
## in-app picker.
native-dialogs = ["dep:rfd"]
## Icons from the Phosphor icon font (see `egui-pop-core`).
phosphor = ["egui-pop-core/phosphor"]
## The families a theme names, found among the system's fonts.
system-fonts = ["egui-pop-core/system-fonts"]
## An application's own SVG icons.
svg = ["egui-pop-core/svg"]

[dependencies]
profiling.workspace = true
egui.workspace = true
egui-pop-model.workspace = true
egui-pop-core.workspace = true
eframe = { workspace = true, optional = true, features = ["default_fonts", "wgpu", "accesskit", "wayland", "x11"] }
egui_dock.workspace = true
log.workspace = true
serde.workspace = true
rfd = { workspace = true, optional = true }
serde_json.workspace = true
# The Windows layer of the frame (stubs elsewhere).
egui-pop-win32.workspace = true

[target.'cfg(windows)'.dependencies]
# MIT OR Apache-2.0 OR Zlib: the window handle eframe gives, to subclass
# the window for its hit tests.
raw-window-handle = "0.6"

[dev-dependencies]
egui = { workspace = true, features = ["default_fonts"] }
egui_kittest = { workspace = true }
