[package]
name = "egui-pop-viewport"
version = "0.2.0"
description = "A generic tiled image viewport for egui-pop: pan and zoom in physical pixels, tiles from an asynchronous source (proxy then exact), a display-transform hook, overlays with handles, before/after, a pixel readout, thumbnails and a histogram"
readme = "README.md"
keywords = ["egui", "image", "viewport", "tiles", "zoom"]
categories = ["gui", "multimedia::images"]
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true

[lints]
workspace = true

[[example]]
name = "viewer"
required-features = ["wgpu"]

[[example]]
name = "gpu_tiles"
required-features = ["wgpu"]

[features]
default = ["wgpu", "wayland"]
## The GPU path: scene tiles as half-float textures drawn by an
## `egui_wgpu` paint callback that runs the display transform.
wgpu = ["dep:egui-wgpu", "dep:half"]
## The image on a surface of its own on Wayland (`image_surface`): a
## subsurface tagged through `wp_color_management_v1` for wide gamut,
## below egui's sRGB interface; sRGB elsewhere, with the reason.
wayland = ["wgpu", "dep:egui-pop-wayland"]
## A reference graph model kept in a YAML file (`graph::yaml`), for
## applications without a graph model of their own: read, edited by the
## node graph editor, written back with comments and order kept.
graph-yaml = ["dep:serde", "dep:serde-saphyr"]
## The node graph exported as PNG (`GraphExport::png`): the SVG export
## rendered by resvg with its text support (font shaping), in the
## theme's installed faces, egui's bundled faces behind them.
graph-png = ["dep:resvg", "resvg/text", "dep:fontdb", "egui/default_fonts"]
## The node graph exported as PDF (`GraphExport::pdf`): the SVG export
## converted by svg2pdf, the theme's faces embedded (subset).
graph-pdf = ["dep:svg2pdf", "dep:fontdb", "egui/default_fonts"]

[dependencies]
profiling.workspace = true
egui.workspace = true
# The node graph's orthogonal wires (a crate of this workspace, no egui).
ortho-router.workspace = true
egui-wgpu = { version = "0.36", default-features = false, optional = true }
# MIT OR Apache-2.0: f32 to half-float conversion for tile textures.
half = { version = "2", optional = true }
egui-pop-core.workspace = true
egui-pop-wayland = { workspace = true, optional = true }
serde_json.workspace = true
serde = { workspace = true, optional = true }
serde-saphyr = { workspace = true, optional = true }
# MIT OR Apache-2.0, the version egui-pop-core's `svg` feature uses: the
# PNG export (feature `graph-png`), with its `text` feature.
resvg = { version = "0.46", optional = true, default-features = false }
# MIT: the fonts the PNG and PDF exports draw with (the version resvg
# and svg2pdf read).
fontdb = { version = "0.23", optional = true, default-features = false, features = ["std"] }
# MIT OR Apache-2.0: the PDF export (feature `graph-pdf`).
svg2pdf = { version = "0.13", optional = true, default-features = false, features = ["text"] }

[dev-dependencies]
eframe = { workspace = true, features = ["default_fonts", "wgpu", "wayland", "x11"] }
egui = { workspace = true, features = ["default_fonts"] }
egui_kittest = { workspace = true, features = ["wgpu", "snapshot"] }
# Path only: a dev-dependency without a version is left out when
# publishing (the test kit depends on this crate).
egui-pop-test = { path = "../egui-pop-test", features = ["viewport", "wgpu"] }
serde_json.workspace = true
# MIT OR Apache-2.0, already in the tree through wgpu: the viewport's
# WGSL parsed and validated in unit tests, without a GPU.
naga = { version = "30", features = ["wgsl-in"] }
# MIT OR Apache-2.0, already in the tree through egui-wgpu: its stub
# device (`noop`) lets unit tests make device tiles without a GPU.
wgpu = { version = "30", default-features = false, features = ["noop"] }
# MIT OR Apache-2.0, already in the tree through resvg: the SVG export's
# tests parse what it writes.
roxmltree = "0.21"
