[package]
name = "egui-pop-viewport"
version = "0.0.1"
description = "A generic tiled image viewport for egui-pop: pan and zoom in physical pixels, tiles from an asynchronous source (proxy then exact), a display-transform hook, overlays with handles, before/after, a pixel readout, thumbnails and a histogram"
keywords = ["egui", "image", "viewport", "tiles", "zoom"]
categories = ["gui", "multimedia::images"]
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[lints]
workspace = true

[features]
default = ["wgpu"]
## The GPU path: scene tiles as half-float textures drawn by an
## `egui_wgpu` paint callback that runs the display transform.
wgpu = ["dep:egui-wgpu", "dep:half"]

[dependencies]
egui.workspace = true
egui-wgpu = { version = "0.36", default-features = false, optional = true }
# MIT OR Apache-2.0: f32 to half-float conversion for tile textures.
half = { version = "2", optional = true }
egui-pop-core.workspace = true
serde_json.workspace = true

[dev-dependencies]
egui = { workspace = true, features = ["default_fonts"] }
egui_kittest = { workspace = true, features = ["wgpu", "snapshot"] }
egui-pop-test = { workspace = true, features = ["viewport", "wgpu"] }
serde_json.workspace = true
