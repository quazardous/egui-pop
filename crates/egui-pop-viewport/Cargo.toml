[package]
name = "egui-pop-viewport"
version = "0.1.0"
description = "A generic tiled image viewport for egui-pop: pan and zoom in physical pixels, tiles from an asynchronous source (proxy then exact), a display-transform hook, overlays with handles, before/after, a pixel readout, thumbnails and a histogram"
keywords = ["egui", "image", "viewport", "tiles", "zoom"]
categories = ["gui", "multimedia::images"]
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[lints]
workspace = true

[[example]]
name = "viewer"
required-features = ["wgpu"]

[[example]]
name = "gpu_tiles"
required-features = ["wgpu"]

[features]
default = ["wgpu", "wayland"]
## The GPU path: scene tiles as half-float textures drawn by an
## `egui_wgpu` paint callback that runs the display transform.
wgpu = ["dep:egui-wgpu", "dep:half"]
## The image on a surface of its own on Wayland (`image_surface`): a
## subsurface tagged through `wp_color_management_v1` for wide gamut,
## below egui's sRGB interface; sRGB elsewhere, with the reason.
wayland = ["wgpu", "dep:egui-pop-wayland"]

[dependencies]
profiling.workspace = true
egui.workspace = true
egui-wgpu = { version = "0.36", default-features = false, optional = true }
# MIT OR Apache-2.0: f32 to half-float conversion for tile textures.
half = { version = "2", optional = true }
egui-pop-core.workspace = true
egui-pop-wayland = { workspace = true, optional = true }
serde_json.workspace = true

[dev-dependencies]
eframe = { workspace = true, features = ["default_fonts", "wgpu", "wayland", "x11"] }
egui = { workspace = true, features = ["default_fonts"] }
egui_kittest = { workspace = true, features = ["wgpu", "snapshot"] }
# Path only: a dev-dependency without a version is left out when
# publishing (the test kit depends on this crate).
egui-pop-test = { path = "../egui-pop-test", features = ["viewport", "wgpu"] }
serde_json.workspace = true
