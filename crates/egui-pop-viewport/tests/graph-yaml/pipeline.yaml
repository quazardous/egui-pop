# A small processing graph, written by hand.
$extensions:
  org.egui-pop.graph: {version: 1}
  com.example.app: {author: someone}   # an application's own stamp

# Groups: an id and a label.
groups:
  detail: Detail
  tone: {label: Tone}

kinds:
  load:
    title: Load
    outputs:
      image: image
  blur:
    title: Blur
    inputs: {image: image}
    outputs: {image: image}
    params:
      radius: {label: Radius, value: 2, min: 0, max: 20, step: 0.1, unit: px}
  mix:
    title: Blend
    inputs:
      base: image
      top: image
      mask: {type: mask, label: Mask}
    outputs: {image: image}
    params:
      opacity:
        label: Opacity
        value: 1
        min: 0
        max: 1
  output:
    title: Output
    inputs:
      image: {type: image, multiple: true}

nodes:
  # The source.
  - id: load
    kind: load
    pos: [0, 0]   # top left
    note: "kept as written"

  - id: blur
    kind: blur
    title: Soft blur
    pos: [240, 0]
    group: detail
    params:
      radius: 3.5 # softer

  - id: mix
    kind: mix
    pos: [480, 40]
    group: tone
    params:
      opacity:
        value: 0.8

  - id: output
    kind: output
    pos: [720, 40]

# Wires: an output, then an input.
edges:
  - load.image -> blur.image
  - blur.image -> mix.base
  - {from: load.image, to: mix.top, color: accent}
  - mix.image -> output.image
