[package]
name = "egui-pop-hooks"
version = "0.2.0"
description = "A small hook kernel: typed hook points, listeners with ids ordered by after/before and priority, alter and collect emits, a per-listener error boundary with panics caught and deadlines, introspection (no GUI toolkit); an implementation of the bus-contract crate"
readme = "README.md"
keywords = ["hooks", "plugins", "extension-points", "listeners", "events"]
categories = ["rust-patterns", "concurrency"]
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true

[lints]
workspace = true

[dependencies]
bus-contract.workspace = true
# MIT OR Apache-2.0: the listener deadlines' clock on the web too, where
# `std::time::Instant::now` panics.
web-time = "1"
