[package]
name = "egui-pop-core"
version = "0.2.0"
description = "The egui layer of egui-pop: theme, focus scopes, a key dispatcher, overlays, placement, accessibility helpers, strings, icons, persistence, fault boundaries, value binding and a debug bridge"
readme = "README.md"
keywords = ["egui", "gui", "accessibility", "theme", "keyboard"]
categories = ["gui"]
edition.workspace = true
rust-version.workspace = true
# The code is MIT or Apache-2.0; the fonts in `fonts/` (feature
# `bundled-fonts`) are under the SIL Open Font License 1.1, its text
# next to them.
license = "(MIT OR Apache-2.0) AND OFL-1.1"
repository.workspace = true
homepage.workspace = true
authors.workspace = true

[lints]
workspace = true

[features]
default = ["bundled-fonts"]
## egui-pop's default pair, Inter and JetBrains Mono NL (SIL Open Font
## License 1.1, about 620 KB): the generic families draw them. Without
## it, egui's own pair (Ubuntu Light and Hack) is the default.
bundled-fonts = []
## Draw icons from the Phosphor icon font (egui-phosphor), installed with
## the theme; without it, icons are painted.
phosphor = ["dep:egui-phosphor"]
## Find the families a theme names among the system's fonts (fontdb:
## scans the font directories, reads fontconfig's files, no C library).
system-fonts = ["dep:fontdb"]
## An application's own icons from SVG files (`icon_set`), rasterised
## with resvg when the theme is installed.
svg = ["dep:resvg"]
## Theme packages as `.zip` archives (`egui_pop_tokens::package`): a
## theme and its font files in one file.
theme-zip = ["egui-pop-tokens/zip"]

[dependencies]
egui.workspace = true
egui-phosphor = { workspace = true, optional = true }
# MIT: the system's fonts by family and weight (feature `system-fonts`).
fontdb = { version = "0.23", optional = true }
# MIT OR Apache-2.0: SVG icons (feature `svg`); no text, no raster images.
resvg = { version = "0.46", optional = true, default-features = false }
# MIT OR Apache-2.0, egui's own font reader (the version epaint uses):
# a font file a user adds is checked, and its family and weight read,
# before it reaches egui, which panics on a file it cannot parse.
skrifa = { version = "0.44", default-features = false, features = ["std"] }
egui-pop-tokens.workspace = true
egui-pop-model.workspace = true
log.workspace = true
serde.workspace = true
serde_json.workspace = true

[dev-dependencies]
# Path only (left out when publishing): the `critical` mark of the
# tests that run on every change (docs/testing.md).
egui-pop-test-macros = { path = "../egui-pop-test-macros" }
egui = { workspace = true, features = ["default_fonts"] }
egui_kittest = { workspace = true, features = ["wgpu"] }
