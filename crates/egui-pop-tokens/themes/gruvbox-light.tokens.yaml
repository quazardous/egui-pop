$extends: "pop-light"
$description: "Inspired by Gruvbox Light (medium) by Pavel Pertsev (morhetz, MIT/X11 licence), as mapped to a workbench by the Gruvbox Theme for VS Code by jdinhlife (MIT)."
$extensions:
  org.egui-pop.variant-of: "gruvbox-dark"
  org.egui-pop.source:
    repository: "https://github.com/jdinhify/vscode-theme-gruvbox"
    file: "themes/gruvbox-light-medium.json"
    version: "1.29.1"
    commit: "ca3b8ad203e84a884ca33fb84b5795cf43032709"
    license: "MIT"
    note: "Read from the published extension package (Open VSX jdinhlife.gruvbox 1.29.1)."
    palette: "https://github.com/morhetz/gruvbox (README palette, commit ef8864bb42bf244f0295d1c5a403b27e3d139695; licence stated as MIT/X11 in the README)"
gray:
  $type: "color"
  $description: "Gruvbox's light backgrounds bg0_h to bg4 and inks fg4 to fg0."
  "0":
    $value: {colorSpace: "oklch", components: [0.9655, 0.0394, 100.86], hex: "#f9f5d7"}
    $description: "bg0_h"
  "1":
    $value: {colorSpace: "oklch", components: [0.9555, 0.0555, 96.15], hex: "#fbf1c7"}
    $description: "bg0: editor.background, sideBar.background"
  "2":
