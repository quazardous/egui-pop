    file: "themes/OneLight.json"
    version: "2.3.0"
    commit: "5866e900db932d580e978a58db42f65cde07998b"
    license: "MIT"
gray:
  $type: "color"
  $description: "One Light's neutrals: white fields, the #fafafa editor, mono-1 to mono-3 inks."
  "0":
    $value: {colorSpace: "oklch", components: [1.0, 0.0, 0.0], hex: "#ffffff"}
    $description: "input.background, dropdown.background"
  "1":
    $value: {colorSpace: "oklch", components: [0.9851, 0.0, 0.0], hex: "#fafafa"}
    $description: "editor.background"
  "2":
