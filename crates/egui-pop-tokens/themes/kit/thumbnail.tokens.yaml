$description: "The `thumbnail` component of the default kit (docs/kit.md), layered into pop-dark."
thumbnail:
  $description: "A thumbnail of the viewport crate (a kit component): selected, under the pointer (never while selected), focused."
  shape:
    $type: "string"
    $value: "box"
  rest:
    fill:
      $type: "color"
      $value: "{surface.raised}"
    border-color:
      $type: "color"
      $value: "{border.strong}"
    border-width:
      $type: "dimension"
      $value: {value: 0, unit: "px"}
    radius:
      $type: "dimension"
      $value: "{radius.widget}"
  selected:
    border-color:
      $type: "color"
      $value: "{accent.default}"
    border-width:
      $type: "dimension"
      $value: {value: 2, unit: "px"}
  hover:
    border-width:
      $type: "dimension"
      $value: {value: 1, unit: "px"}
  focus:
    ring-color:
      $type: "color"
      $value: "{focus.ring}"
    ring-width:
      $type: "dimension"
      $value: {value: 2, unit: "px"}
    ring-offset:
      $type: "dimension"
      $value: {value: 1, unit: "px"}
