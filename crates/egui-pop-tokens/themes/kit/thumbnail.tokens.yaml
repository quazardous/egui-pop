$description: "The `thumbnail` component of the default kit (docs/kit.md), layered into pop-dark."
thumbnail:
  $description: "A thumbnail of the viewport crate (a kit component): selected, under the pointer (never while selected), focused. Based on the library's `thumb-cell`, its fill kept in every state and a wider ring."
  based-on:
    $type: "string"
    $value: "thumb-cell"
  selected:
    fill:
      $type: "color"
      $value: "{surface.raised}"
  hover:
    fill:
      $type: "color"
      $value: "{surface.raised}"
  focus:
    ring-width:
      $type: "dimension"
      $value: {value: 2, unit: "px"}
