$description: "The `search-field` component of the default kit (docs/kit.md), layered into pop-dark."
search-field:
  $description: "The library's search field around its chips and text (a kit component): `focus` while its text has the keyboard."
  shape:
    $type: "string"
    $value: "card"
  padding-x:
    $type: "dimension"
    $value: "{space.s}"
  padding-y:
    $type: "dimension"
    $value: "{space.xs}"
  rest:
    fill:
      $type: "color"
      $value: "{surface.sunken}"
    border-color:
      $type: "color"
      $value: "{border.default}"
    border-width:
      $type: "dimension"
      $value: {value: 1, unit: "px"}
    radius:
      $type: "dimension"
      $value: "{radius.widget}"
  focus:
    ring-color:
      $type: "color"
      $value: "{focus.ring}"
    ring-width:
      $type: "dimension"
      $value: {value: 1, unit: "px"}
    ring-offset:
      $type: "dimension"
      $value: {value: 1, unit: "px"}
