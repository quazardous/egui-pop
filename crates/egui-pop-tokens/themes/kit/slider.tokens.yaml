$description: "The `slider` component of the default kit (docs/kit.md), layered into pop-dark."
slider:
  $description: "A slider's bar (a kit component): its track, its label at the start; hover, active while dragged, focus. Its fill is a `slider-fill`, its thumbs `slider-thumb`, its value a `slider-value`."
  shape:
    $type: "string"
    $value: "box"
    $description: "The handler that draws it: box (fill, border, radius, ring) or plain."
  align:
    $type: "string"
    $value: "start"
  padding-x:
    $type: "dimension"
    $value: "{space.s}"
  rest:
    fill:
      $type: "color"
      $value: "{border.default}"
    border-color:
      $type: "color"
      $value: "{border.strong}"
    border-width:
      $type: "dimension"
      $value: {value: 0, unit: "px"}
    radius:
      $type: "dimension"
      $value: "{radius.widget}"
    text:
      $type: "color"
      $value: "{text.default}"
  hover:
    border-color:
      $type: "color"
      $value: "{border.strong}"
    border-width:
      $type: "dimension"
      $value: {value: 1, unit: "px"}
  active:
    border-color:
      $type: "color"
      $value: "{focus.ring}"
    border-width:
      $type: "dimension"
      $value: {value: 1, unit: "px"}
  focus:
    border-width:
      $type: "dimension"
      $value: {value: 0, unit: "px"}
    ring-color:
      $type: "color"
      $value: "{focus.ring}"
    ring-width:
      $type: "dimension"
      $value: {value: 2, unit: "px"}
    ring-offset:
      $type: "dimension"
      $value: {value: -2, unit: "px"}
