$description: "The `window` component of the default kit (docs/kit.md), layered into pop-dark."
window:
  $description: "A window drawn by the application."
  grip:
    $type: "dimension"
    $value: "{size.frame.grip}"
    $description: "Width of the resize edges."
  corners:
    $type: "string"
    $value: "round"
    $description: "The window's corners where the system can round a window drawn by the application (Windows 11): round, small or square."
  # The line around a window the application draws, inside its edges:
  # none in the default kit (the system's shadow and corners frame it).
  rest:
    border-width:
      $type: "dimension"
      $value: {value: 0, unit: "px"}
    border-color:
      $type: "color"
      $value: "{border.default}"
