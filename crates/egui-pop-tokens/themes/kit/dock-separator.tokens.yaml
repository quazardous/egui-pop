$description: "The `dock-separator` component of the default kit (docs/kit.md), layered into pop-dark."
dock-separator:
  $description: "The line between two panels of a dock, side by side or one above the other (a kit component): `width` thick, in the middle of the room it takes the pointer on; its `fill` at `rest`, under the pointer (`hover`), while dragged (`active`), and its ring while it has the keyboard (`focus`). The default kit draws it as the `splitter`."
  shape:
    $type: "string"
    $value: "plain"
  width:
    $type: "dimension"
    $value: {value: 1, unit: "px"}
  rest:
    fill:
      $type: "color"
      $value: "{border.default}"
    border-color:
      $type: "color"
      $value: "{transparent}"
    border-width:
      $type: "dimension"
      $value: {value: 0, unit: "px"}
  hover:
    fill:
      $type: "color"
      $value: "{text.strong}"
  active:
    fill:
      $type: "color"
      $value: "{accent.default}"
  focus:
    ring-color:
      $type: "color"
      $value: "{focus.ring}"
    ring-width:
      $type: "dimension"
      $value: {value: 1, unit: "px"}
    ring-offset:
      $type: "dimension"
      $value: {value: 2, unit: "px"}
