$description: "The default kit's glyphs (docs/kit.md): the icon drawn for each role, layered into pop-dark."
glyph:
  $type: "string"
  $description: "The icon of each glyph role, by its name in the kit's icon set."
  disclosure-open:
    $value: "triangle-down"
  disclosure-closed:
    $value: "triangle-right"
  sort-ascending:
    $value: "triangle-up"
  sort-descending:
    $value: "triangle-down"
  check:
    $value: "check"
  radio:
    $value: "dot"
  indeterminate:
    $value: "minus"
  bullet:
    $value: "dot"
  submenu:
    $value: "chevron-right"
  chevron-start:
    $value: "chevron-left"
  chevron-end:
    $value: "chevron-right"
  close:
    $value: "close"
  more:
    $value: "more"
  drag-handle:
    $value: "grip"
  dropdown:
    $value: "triangle-down"
  expand:
    $value: "plus"
  collapse:
    $value: "minus"
  window-minimize:
    $value: "window-minimize"
  window-maximize:
    $value: "window-maximize"
  window-restore:
    $value: "window-restore"
  window-close:
    $value: "window-close"
  window-exit-fullscreen:
    $value: "exit-fullscreen"
  led-off:
    $value: "circle"
  led-on:
    $value: "disc"
  led-busy:
    $value: "disc"
  led-warning:
    $value: "triangle"
  led-error:
    $value: "square"
  flag-modified:
    $value: "corner"
  flag-pinned:
    $value: "diamond"
  flag-required:
    $value: "asterisk"
  flag-invalid:
    $value: "triangle"
