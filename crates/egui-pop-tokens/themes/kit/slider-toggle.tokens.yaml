$description: "The `slider-toggle` component of the default kit (docs/kit.md), layered into pop-dark."
slider-toggle:
  $description: "The square button at a slider's end (a kit component), its icon in `text`: selected while its toggle is on, hover, active, focus."
  shape:
    $type: "string"
    $value: "box"
    $description: "The handler that draws it: box (fill, border, radius, ring) or plain."
  rest:
    fill:
      $type: "color"
      $value: "{border.default}"
    border-color:
      $type: "color"
      $value: "{border.strong}"
    border-width:
      $type: "dimension"
      $value: {value: 0, unit: "px"}
    radius:
      $type: "dimension"
      $value: "{slider.rest.radius}"
    text:
      $type: "color"
      $value: "{text.default}"
  selected:
    text:
      $type: "color"
      $value: "{accent.default}"
  hover:
    border-color:
      $type: "color"
      $value: "{border.strong}"
    border-width:
      $type: "dimension"
      $value: {value: 1, unit: "px"}
  active:
    border-color:
      $type: "color"
      $value: "{focus.ring}"
    border-width:
      $type: "dimension"
      $value: {value: 1, unit: "px"}
  focus:
    border-width:
      $type: "dimension"
      $value: {value: 0, unit: "px"}
    ring-color:
      $type: "color"
      $value: "{focus.ring}"
    ring-width:
      $type: "dimension"
      $value: {value: 2, unit: "px"}
    ring-offset:
      $type: "dimension"
      $value: {value: -2, unit: "px"}
