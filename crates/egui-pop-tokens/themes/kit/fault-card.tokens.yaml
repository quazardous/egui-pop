$description: "The `fault-card` component of the default kit (docs/kit.md), layered into pop-dark."
fault-card:
  $description: "The card standing in for a part that panicked (a kit component)."
  shape:
    $type: "string"
    $value: "card"
  padding-x:
    $type: "dimension"
    $value: "{space.m}"
  padding-y:
    $type: "dimension"
    $value: "{space.m}"
  rest:
    fill:
      $type: "color"
      $value: "{surface.raised}"
    border-color:
      $type: "color"
      $value: "{danger}"
    border-width:
      $type: "dimension"
      $value: {value: 1, unit: "px"}
    radius:
      $type: "dimension"
      $value: "{radius.widget}"
