$description: "The `plot` component of the default kit (docs/kit.md), layered into pop-dark."
plot:
  $description: "A chart's plot area (a kit component): its background and frame, its axis text and grid in `text`; its time cursor is `plot-cursor`. The series take the categorical palette (`palette.category.*`)."
  shape:
    $type: "string"
    $value: "box"
    $description: "The handler that draws its background and frame: box or plain."
  rest:
    fill:
      $type: "color"
      $value: "{surface.canvas}"
    border-color:
      $type: "color"
      $value: "{border.default}"
    border-width:
      $type: "dimension"
      $value: {value: 1, unit: "px"}
    radius:
      $type: "dimension"
      $value: "{radius.widget}"
    text:
      $type: "color"
      $value: "{text.muted}"
  hover:
    text:
      $type: "color"
      $value: "{text.default}"
