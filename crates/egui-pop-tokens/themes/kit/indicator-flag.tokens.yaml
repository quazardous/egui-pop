$description: "The `indicator-flag` component of the default kit (docs/kit.md), layered into pop-dark."
indicator-flag:
  $description: "A flag on a row, a tile or a field (a micro-indicator; a kit component, colours only: egui-pop draws its shape, a corner triangle, a stripe, a diamond, a triangle, a square or an asterisk): its colour in fill, by tone; width is its size (a corner triangle's legs)."
  shape:
    $type: "string"
    $value: "plain"
  width:
    $type: "dimension"
    $value: {value: 8, unit: "px"}
  rest:
    fill:
      $type: "color"
      $value: "{text.default}"
  tone:
    accent:
      fill:
        $type: "color"
        $value: "{accent.default}"
    info:
      fill:
        $type: "color"
        $value: "{info}"
    success:
      fill:
        $type: "color"
        $value: "{success}"
    warning:
      fill:
        $type: "color"
        $value: "{warning}"
    danger:
      fill:
        $type: "color"
        $value: "{danger}"
    muted:
      fill:
        $type: "color"
        $value: "{text.muted}"
    record:
      fill:
        $type: "color"
        $value: "{danger}"
