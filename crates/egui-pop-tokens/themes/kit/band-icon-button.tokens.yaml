$description: "The `band-icon-button` component of the default kit (docs/kit.md), layered into pop-dark."
band-icon-button:
  $description: "An icon button on a header band (a palette's close, roll and pin, a dialog's close), its icon in `text`; `selected` for a palette pinned."
  shape:
    $type: "string"
    $value: "box"
  rest:
    fill:
      $type: "color"
      $value: "{transparent}"
    border-color:
      $type: "color"
      $value: "{transparent}"
    border-width:
      $type: "dimension"
      $value: {value: 0, unit: "px"}
    radius:
      $type: "dimension"
      $value: "{radius.widget}"
    text:
      $type: "color"
      $value: "{text.default}"
  selected:
    fill:
      $type: "color"
      $value: "{surface.raised}"
    text:
      $type: "color"
      $value: "{text.strong}"
  hover:
    fill:
      $type: "color"
      $value: "{surface.hover}"
    text:
      $type: "color"
      $value: "{text.strong}"
  focus:
    fill:
      $type: "color"
      $value: "{surface.active}"
    ring-color:
      $type: "color"
      $value: "{focus.ring}"
    ring-width:
      $type: "dimension"
      $value: {value: 2, unit: "px"}
    ring-offset:
      $type: "dimension"
      $value: {value: -2, unit: "px"}
  active:
    fill:
      $type: "color"
      $value: "{surface.active}"
