$description: "The `band-icon-button` component of the default kit (docs/kit.md), layered into pop-dark."
band-icon-button:
  $description: "An icon button on a header band (a palette's close, roll and pin, a dialog's close), its icon in `text`; `selected` for a palette pinned. Based on `icon-button`, with a fill under the pointer and a ring inside it."
  based-on:
    $type: "string"
    $value: "icon-button"
  selected:
    fill:
      $type: "color"
      $value: "{surface.raised}"
    text:
      $type: "color"
      $value: "{text.strong}"
  hover:
    fill:
      $type: "color"
      $value: "{surface.hover}"
  focus:
    fill:
      $type: "color"
      $value: "{surface.active}"
    ring-width:
      $type: "dimension"
      $value: {value: 2, unit: "px"}
    ring-offset:
      $type: "dimension"
      $value: {value: -2, unit: "px"}
  active:
    fill:
      $type: "color"
      $value: "{surface.active}"
