$description: "The `activity-bar-item` component of the default kit (docs/kit.md), layered into pop-dark."
activity-bar-item:
  $description: "An icon of the activity bar, its icon (or letter) in `text`: `selected` while its panel is shown (never `hover` then), `focus` with the keyboard."
  shape:
    $type: "string"
    $value: "box"
  rest:
    fill:
      $type: "color"
      $value: "{transparent}"
    border-color:
      $type: "color"
      $value: "{transparent}"
    border-width:
      $type: "dimension"
      $value: {value: 0, unit: "px"}
    radius:
      $type: "dimension"
      $value: "{radius.widget}"
    text:
      $type: "color"
      $value: "{text.muted}"
  selected:
    fill:
      $type: "color"
      $value: "{accent.subtle}"
    text:
      $type: "color"
      $value: "{text.strong}"
  hover:
    fill:
      $type: "color"
      $value: "{surface.hover}"
    text:
      $type: "color"
      $value: "{text.strong}"
  focus:
    ring-color:
      $type: "color"
      $value: "{focus.ring}"
    ring-width:
      $type: "dimension"
      $value: {value: 2, unit: "px"}
    ring-offset:
      $type: "dimension"
      $value: {value: -2, unit: "px"}
  active:
    fill:
      $type: "color"
      $value: "{surface.active}"
