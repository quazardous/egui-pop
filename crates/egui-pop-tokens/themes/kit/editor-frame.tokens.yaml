$description: "The `editor-frame` component of the default kit (docs/kit.md), layered into pop-dark."
editor-frame:
  $description: "The frame around a text or code editor (a kit component)."
  shape:
    $type: "string"
    $value: "card"
  padding-x:
    $type: "dimension"
    $value: {value: 1, unit: "px"}
  padding-y:
    $type: "dimension"
    $value: {value: 1, unit: "px"}
  rest:
    fill:
      $type: "color"
      $value: "{surface.panel}"
    border-color:
      $type: "color"
      $value: "{border.default}"
    border-width:
      $type: "dimension"
      $value: {value: 1, unit: "px"}
    radius:
      $type: "dimension"
      $value: "{radius.widget}"
  focus:
    ring-color:
      $type: "color"
      $value: "{focus.ring}"
    ring-width:
      $type: "dimension"
      $value: {value: 1, unit: "px"}
    ring-offset:
      $type: "dimension"
      $value: {value: -1, unit: "px"}
