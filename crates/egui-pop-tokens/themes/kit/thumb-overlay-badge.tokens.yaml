$description: "The `thumb-overlay-badge` component of the default kit (docs/kit.md), layered into pop-dark."
thumb-overlay-badge:
  $description: "The small box behind a cell's flag, colour labels and stars, and a comparison's best button (a kit component); `text` is the best button's star under the pointer. Based on `pill` (the neutral one), with square corners."
  based-on:
    $type: "string"
    $value: "pill"
  shape:
    $type: "string"
    $value: "box"
  rest:
    radius:
      $type: "dimension"
      $value: {value: 3, unit: "px"}
