$description: "The `find-bar-button` component of the default kit (docs/kit.md), layered into pop-dark."
find-bar-button:
  $description: "An icon button of an editor's find bar (previous, next, close), its icon in `text`. Based on `icon-button`, with a fill under the pointer and a ring inside it."
  based-on:
    $type: "string"
    $value: "icon-button"
  hover:
    fill:
      $type: "color"
      $value: "{surface.hover}"
  focus:
    ring-width:
      $type: "dimension"
      $value: {value: 2, unit: "px"}
    ring-offset:
      $type: "dimension"
      $value: {value: -2, unit: "px"}
  active:
    fill:
      $type: "color"
      $value: "{surface.active}"
