$description: "The `command-palette-row` component of the default kit (docs/kit.md), layered into pop-dark."
command-palette-row:
  $description: "A command in the command palette's list: egui lays it out and takes its clicks, the kit paints its box under it; `selected` for the one Enter runs (never `hover` then). Its matched characters are in the `accent` tone, its keys in the `muted` tone. Based on `menu-item`, outlined, and selected like a list's row."
  based-on:
    $type: "string"
    $value: "menu-item"
  rest:
    border-width:
      $type: "dimension"
      $value: {value: 1, unit: "px"}
  selected:
    fill:
      $type: "color"
      $value: "{selection}"
    border-color:
      $type: "color"
      $value: "{border.default}"
  # Its label keeps its colour under the pointer and pressed, unlike a
  # menu item's.
  hover:
    border-color:
      $type: "color"
      $value: "{border.strong}"
    text:
      $type: "color"
      $value: "{text.default}"
  active:
    border-color:
      $type: "color"
      $value: "{focus.ring}"
    text:
      $type: "color"
      $value: "{text.default}"
  tone:
    accent:
      text:
        $type: "color"
        $value: "{text.strong}"
