$description: "The `meter-tick` component of the default kit (docs/kit.md), layered into pop-dark."
meter-tick:
  $description: "A meter's threshold: a line across its track, `width` thick (a kit component)."
  shape:
    $type: "string"
    $value: "tick"
  width:
    $type: "dimension"
    $value: {value: 1, unit: "px"}
  rest:
    fill:
      $type: "color"
      $value: "{text.muted}"
