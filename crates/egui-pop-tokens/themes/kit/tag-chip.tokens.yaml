$description: "The `tag-chip` component of the default kit (docs/kit.md), layered into pop-dark."
tag-chip:
  $description: "A tag or a filter criterion as a chip (a kit component): selected, under the pointer, focused. Its remove button is drawn by the widget."
  shape:
    $type: "string"
    $value: "pill"
  padding-x:
    $type: "dimension"
    $value: "{space.s}"
  align:
    $type: "string"
    $value: "start"
  rest:
    fill:
      $type: "color"
      $value: "{surface.active}"
    border-color:
      $type: "color"
      $value: "{accent.default}"
    border-width:
      $type: "dimension"
      $value: {value: 0, unit: "px"}
    radius:
      $type: "dimension"
      $value: {value: 999, unit: "px"}
    text:
      $type: "color"
      $value: "{text.default}"
  selected:
    fill:
      $type: "color"
      $value: "{accent.subtle}"
    border-width:
      $type: "dimension"
      $value: {value: 1, unit: "px"}
  hover:
    fill:
      $type: "color"
      $value: "{surface.hover}"
  focus:
    ring-color:
      $type: "color"
      $value: "{focus.ring}"
    ring-width:
      $type: "dimension"
      $value: {value: 1, unit: "px"}
    ring-offset:
      $type: "dimension"
      $value: {value: 1, unit: "px"}
