$description: "The `spinner` component of the default kit (docs/kit.md), layered into pop-dark."
spinner:
  $description: "A spinner (a kit component, colours only like progress-ring): its track in fill, its arc in indicator-color by tone, its label in text; width is its diameter."
  shape:
    $type: "string"
    $value: "plain"
  width:
    $type: "dimension"
    $value: "{size.icon.inline}"
  rest:
    fill:
      $type: "color"
      $value: "{border.default}"
    indicator-color:
      $type: "color"
      $value: "{accent.default}"
    text:
      $type: "color"
      $value: "{text.muted}"
  tone:
    accent:
      indicator-color:
        $type: "color"
        $value: "{accent.default}"
    info:
      indicator-color:
        $type: "color"
        $value: "{info}"
    success:
      indicator-color:
        $type: "color"
        $value: "{success}"
    warning:
      indicator-color:
        $type: "color"
        $value: "{warning}"
    danger:
      indicator-color:
        $type: "color"
        $value: "{danger}"
    muted:
      indicator-color:
        $type: "color"
        $value: "{text.muted}"
    record:
      $description: "Recording: the danger colour by default; a kit may tell it from an error."
      indicator-color:
        $type: "color"
        $value: "{danger}"
