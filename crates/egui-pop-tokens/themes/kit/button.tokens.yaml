$description: "The `button` component of the default kit (docs/kit.md), layered into pop-dark. egui's own widgets take their states from it."
button:
  $description: "Push buttons. egui's widgets are drawn with these: rest, hover, active, and selected for an open menu or combo box."
  shape:
    $type: "string"
    $value: "box"
  rest:
    fill:
      $type: "color"
      $value: "{surface.raised}"
    border-color:
      $type: "color"
      $value: "{border.default}"
    border-width:
      $type: "dimension"
      $value: {value: 1, unit: "px"}
    radius:
      $type: "dimension"
      $value: "{radius.widget}"
    text:
      $type: "color"
      $value: "{text.default}"
  hover:
    fill:
      $type: "color"
      $value: "{surface.hover}"
    border-color:
      $type: "color"
      $value: "{border.strong}"
    text:
      $type: "color"
      $value: "{text.strong}"
  active:
    fill:
      $type: "color"
      $value: "{surface.active}"
    border-color:
      $type: "color"
      $value: "{focus.ring}"
    text:
      $type: "color"
      $value: "{text.strong}"
  selected:
    fill:
      $type: "color"
      $value: "{surface.hover}"
  tone:
    accent:
      $description: "A primary action: the accent fill."
      fill:
        $type: "color"
        $value: "{accent.default}"
      border-color:
        $type: "color"
        $value: "{accent.default}"
      text:
        $type: "color"
        $value: "{text.on-accent}"
      hover:
        fill:
          $type: "color"
          $value: "{accent.hover}"
        border-color:
          $type: "color"
          $value: "{accent.hover}"
        text:
          $type: "color"
          $value: "{text.on-accent}"
      active:
        fill:
          $type: "color"
          $value: "{accent.default}"
        border-color:
          $type: "color"
          $value: "{accent.default}"
        text:
          $type: "color"
          $value: "{text.on-accent}"
      selected:
        fill:
          $type: "color"
          $value: "{accent.hover}"
        border-color:
          $type: "color"
          $value: "{accent.hover}"
        text:
          $type: "color"
          $value: "{text.on-accent}"
    info:
      fill:
        $type: "color"
        $value: "{info}"
      border-color:
        $type: "color"
        $value: "{info}"
      text:
        $type: "color"
        $value: "{surface.panel}"
      hover:
        fill:
          $type: "color"
          $value: "{info}"
        text:
          $type: "color"
          $value: "{surface.panel}"
      active:
        fill:
          $type: "color"
          $value: "{info}"
        text:
          $type: "color"
          $value: "{surface.panel}"
      selected:
        fill:
          $type: "color"
          $value: "{info}"
        text:
          $type: "color"
          $value: "{surface.panel}"
    success:
      fill:
        $type: "color"
        $value: "{success}"
      border-color:
        $type: "color"
        $value: "{success}"
      text:
        $type: "color"
        $value: "{surface.panel}"
      hover:
        fill:
          $type: "color"
          $value: "{success}"
        text:
          $type: "color"
          $value: "{surface.panel}"
      active:
        fill:
          $type: "color"
          $value: "{success}"
        text:
          $type: "color"
          $value: "{surface.panel}"
      selected:
        fill:
          $type: "color"
          $value: "{success}"
        text:
          $type: "color"
          $value: "{surface.panel}"
    warning:
      fill:
        $type: "color"
        $value: "{warning}"
      border-color:
        $type: "color"
        $value: "{warning}"
      text:
        $type: "color"
        $value: "{surface.panel}"
      hover:
        fill:
          $type: "color"
          $value: "{warning}"
        text:
          $type: "color"
          $value: "{surface.panel}"
      active:
        fill:
          $type: "color"
          $value: "{warning}"
        text:
          $type: "color"
          $value: "{surface.panel}"
      selected:
        fill:
          $type: "color"
          $value: "{warning}"
        text:
          $type: "color"
          $value: "{surface.panel}"
    danger:
      $description: "A destructive action: the status colour as fill, the panel as text (legible both ways)."
      fill:
        $type: "color"
        $value: "{danger}"
      border-color:
        $type: "color"
        $value: "{danger}"
      text:
        $type: "color"
        $value: "{surface.panel}"
      hover:
        fill:
          $type: "color"
          $value: "{danger}"
        text:
          $type: "color"
          $value: "{surface.panel}"
      active:
        fill:
          $type: "color"
          $value: "{danger}"
        text:
          $type: "color"
          $value: "{surface.panel}"
      selected:
        fill:
          $type: "color"
          $value: "{danger}"
        text:
          $type: "color"
          $value: "{surface.panel}"
    record:
      $description: "Recording: the danger colour by default; a kit may tell it from an error."
      fill:
        $type: "color"
        $value: "{danger}"
      border-color:
        $type: "color"
        $value: "{danger}"
      text:
        $type: "color"
        $value: "{surface.panel}"
      hover:
        fill:
          $type: "color"
          $value: "{danger}"
        text:
          $type: "color"
          $value: "{surface.panel}"
      active:
        fill:
          $type: "color"
          $value: "{danger}"
        text:
          $type: "color"
          $value: "{surface.panel}"
      selected:
        fill:
          $type: "color"
          $value: "{danger}"
        text:
          $type: "color"
          $value: "{surface.panel}"
    muted:
      $description: "A quiet action: no box until the pointer is over it."
      fill:
        $type: "color"
        $value: "{transparent}"
      border-color:
        $type: "color"
        $value: "{transparent}"
