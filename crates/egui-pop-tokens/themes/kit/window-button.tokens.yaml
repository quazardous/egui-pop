$description: "The `window-button` component of the default kit (docs/kit.md), layered into pop-dark."
window-button:
  $description: "Minimize and maximize (a kit component)."
  shape:
    $type: "string"
    $value: "plain"
  width:
    $type: "dimension"
    $value: "{size.titlebar.button}"
  rest:
    fill:
      $type: "color"
      $value: "{transparent}"
    text:
      $type: "color"
      $value: "{text.muted}"
  hover:
    fill:
      $type: "color"
      $value: "{surface.hover}"
    text:
      $type: "color"
      $value: "{text.default}"
