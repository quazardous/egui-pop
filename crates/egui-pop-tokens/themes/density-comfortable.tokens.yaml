$description: "Density overlay. The default density: the values the base themes carry. Touches space and size tokens only."
space:
  $type: "dimension"
  xs:
    $value: {value: 2, unit: "px"}
  s:
    $value: {value: 4, unit: "px"}
  m:
    $value: {value: 8, unit: "px"}
  l:
    $value: {value: 12, unit: "px"}
  xl:
    $value: {value: 16, unit: "px"}
size:
  $type: "dimension"
  control:
    height:
      $value: {value: 24, unit: "px"}
  icon:
    inline:
      $value: {value: 16, unit: "px"}
    toolbar:
      $value: {value: 20, unit: "px"}
    panel:
      $value: {value: 24, unit: "px"}
  dialog:
    width:
      $value: {value: 440, unit: "px"}
  toast:
    width:
      $value: {value: 340, unit: "px"}
