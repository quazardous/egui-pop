    commit: "c480e9e49e2a116c458518ecbdec56d50e4af3d2"
    license: "MIT"
    palette: "https://github.com/altercation/solarized (commit 62f656a02f93c5190a8753159e34b385588d5ff3)"
gray:
  $type: "color"
  $description: "Solarized's base tones, dark: base03 the editor, base1 the text."
  "0":
    $value: {colorSpace: "oklch", components: [0.2297, 0.0424, 222.01], hex: "#00212b"}
    $description: "sideBar.background"
  "1":
    $value: {colorSpace: "oklch", components: [0.2673, 0.0486, 219.82], hex: "#002b36"}
    $description: "base03: editor.background"
  "2":
    $value: {colorSpace: "oklch", components: [0.2869, 0.0503, 220.84], hex: "#03303c"}
    $description: "Interpolated in OKLCH between steps 1 and 3."
