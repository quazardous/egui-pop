[package]
name = "egui-pop-test"
version = "0.2.0"
description = "Test kit for egui-pop applications: themed egui_kittest harnesses, a check that every interactive node has a name, an accessibility tree dump, a double click that registers, keymap checks"
readme = "README.md"
keywords = ["egui", "testing", "accessibility", "kittest"]
categories = ["gui", "development-tools::testing"]
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true

[lints]
workspace = true

[features]
## A tile source for the image viewport (`viewport::TestSource`).
viewport = ["dep:egui-pop-viewport"]
## Render with wgpu (snapshots).
wgpu = ["egui_kittest/wgpu", "dep:egui-wgpu"]

[dependencies]
egui-pop-viewport = { workspace = true, optional = true }
egui.workspace = true
egui_kittest.workspace = true
egui-wgpu = { workspace = true, optional = true }
egui-pop-core.workspace = true
egui-pop-api.workspace = true
egui-pop-model.workspace = true
egui-pop-test-macros.workspace = true
serde_json.workspace = true

[dev-dependencies]
egui = { workspace = true, features = ["default_fonts"] }
