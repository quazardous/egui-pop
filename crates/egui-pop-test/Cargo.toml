[package]
name = "egui-pop-test"
version = "0.0.1"
description = "Test kit for egui-pop applications: themed egui_kittest harnesses, a check that every interactive node has a name, an accessibility tree dump, a double click that registers"
keywords = ["egui", "testing", "accessibility", "kittest"]
categories = ["gui", "development-tools::testing"]
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[lints]
workspace = true

[features]
## Render with wgpu (snapshots).
wgpu = ["egui_kittest/wgpu"]

[dependencies]
egui.workspace = true
egui_kittest.workspace = true
egui-pop-core.workspace = true
egui-pop-api.workspace = true

[dev-dependencies]
egui = { workspace = true, features = ["default_fonts"] }
egui-pop-model.workspace = true
serde_json.workspace = true
