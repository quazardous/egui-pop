[package]
name = "egui-pop-views"
version = "0.2.0"
description = "Data views for egui-pop: a live tree over a lazy, asynchronous source, a list and a data table, and a photo library (thumbnail grid, culling, comparison), virtualised, keyboard-driven, every moment a step an application can veto, replace or extend"
readme = "README.md"
keywords = ["egui", "tree", "table", "list", "virtualized"]
categories = ["gui"]
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true

[lints]
workspace = true

[dependencies]
egui.workspace = true
egui-pop-model.workspace = true
egui-pop-core.workspace = true
egui-pop-api.workspace = true
serde.workspace = true
serde_json.workspace = true
# MIT OR Apache-2.0: Rerun's virtualised table (sticky header, resizable
# columns); the data table wraps it.
egui_table = "0.10"
# MIT OR Apache-2.0: the viewer's markdown (feature `markdown`), its
# version tied to egui's (0.25 is on egui 0.36).
egui_commonmark = { version = "0.25", default-features = false, features = ["pulldown_cmark"], optional = true }
# MIT: the parser egui_commonmark uses; the viewer reads a page's blocks,
# headings, links and images with it.
pulldown-cmark = { version = "0.13", default-features = false, optional = true }
# MIT OR Apache-2.0: egui's image loader (decoding only; no file or http
# loader is installed, the viewer hands the bytes over itself).
egui_extras = { version = "0.36", default-features = false, features = ["image"], optional = true }
# MIT OR Apache-2.0: the formats the viewer decodes.
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif"], optional = true }
# MIT OR Apache-2.0: the HTML parser of the viewer's safe subset (feature
# `html`); its tree is read through an allow-list and mapped to markdown.
html5ever = { version = "0.40", optional = true }
# MIT OR Apache-2.0: relative links and images resolved against a page.
url = { workspace = true, optional = true }
log = { workspace = true, optional = true }

# MIT OR Apache-2.0: the viewer's video page (feature `video`), bindings to
# the system's GStreamer libraries (LGPL, installed apart, not crates). Not
# on the web, where the feature only says that video opens outside.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
gstreamer = { version = "0.25", optional = true }
gstreamer-app = { version = "0.25", optional = true }
gstreamer-video = { version = "0.25", optional = true }

# MIT OR Apache-2.0: the viewer's web view (feature `webview`), over the
# system's WebKitGTK (LGPL, installed apart, not a crate); gtk and gdkx11
# (MIT) start GTK, turn its loop and take the child window on X11, which x11rb
# (MIT OR Apache-2.0, already in the tree) makes without `unsafe`.
[target.'cfg(target_os = "linux")'.dependencies]
wry = { version = "0.57", optional = true }
gtk = { version = "0.18", optional = true }
gdkx11 = { version = "0.18", optional = true }
x11rb = { version = "0.13", optional = true }

[features]
## The in-app viewer (`viewer`): markdown pages, `docs:` pages and images,
## with navigation, find in page and zoom.
markdown = ["dep:egui_commonmark", "dep:pulldown-cmark", "dep:egui_extras", "dep:image", "dep:url", "dep:log"]
## The viewer's safe HTML subset: HTML pages shipped by the application or on
## its documentation hosts, parsed by html5ever and mapped to the same blocks
## as markdown.
html = ["markdown", "dep:html5ever"]
## The viewer's video page: local video files played inside, through the
## system's GStreamer. Building it needs GStreamer's development packages,
## running it GStreamer's libraries and plugins (docs/links.md).
video = ["markdown", "dep:gstreamer", "dep:gstreamer-app", "dep:gstreamer-video"]
## The viewer's YouTube page: a YouTube link played inside, in a web view
## (wry over the system's WebKitGTK, Linux only for now). Building it needs
## WebKitGTK's development packages, running it WebKitGTK (docs/links.md).
webview = ["markdown", "dep:wry", "dep:gtk", "dep:gdkx11", "dep:x11rb"]

[dev-dependencies]
egui = { workspace = true, features = ["default_fonts"] }
egui_kittest = { workspace = true }
# No version: a dev-dependency back up the layers, dropped when published.
egui-pop-test = { path = "../egui-pop-test" }
