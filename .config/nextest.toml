# cargo-nextest, the test runner of CI (docs/testing.md): every test in a
# process of its own, the test binaries side by side.

[profile.default]
# A test running longer than this is reported as slow; it is not stopped.
slow-timeout = { period = "60s" }
# Keep going after a failure: one run shows every failing test.
fail-fast = false

# Tests that may render. A crashing Vulkan loader (docs/testing.md) kills
# the process of one test, at random: it is tried again before it counts
# as a failure, and nextest reports it as flaky. The crates whose tests
# never render are left out, so a real failure there fails at once.
[[profile.default.overrides]]
filter = """
not (package(egui-pop-tokens) | package(egui-pop-model) | package(egui-pop-wayland)
     | package(egui-pop-win32) | package(egui-pop-test-macros) | package(xtask))
"""
retries = 2

# Critical tests run on every change: they stay fast.
[[profile.default.overrides]]
filter = "test(/(^|::)critical_/)"
slow-timeout = { period = "10s" }

[profile.ci]
# A test stuck on CI is stopped after four periods.
slow-timeout = { period = "60s", terminate-after = 4 }
fail-fast = false
failure-output = "immediate-final"

[profile.ci.junit]
# target/nextest/ci/junit.xml: every test's time, kept by CI.
path = "junit.xml"

# Every test marked `#[egui_pop_test::critical]`.
[profile.critical]
default-filter = "test(/(^|::)critical_/)"
