[workspace]
resolver = "3"
members = [
    "crates/egui-pop-tokens",
    "crates/ortho-router",
    "crates/egui-pop-win32",
    "crates/egui-pop-wayland",
    "crates/egui-pop-model",
    "crates/egui-pop-core",
    "crates/egui-pop-api",
    "crates/egui-pop-viewport",
    "crates/egui-pop-i18n",
    "crates/egui-pop-platform",
    "crates/egui-pop-views",
    "crates/egui-pop-editors",
    "crates/egui-pop-imaging",
    "crates/egui-pop-test-macros",
    "crates/egui-pop-test",
    "crates/egui-pop",
    "crates/egui-pop-gallery",
    "crates/consumer-smoke",
    "templates/extension",
    "xtask",
]

[workspace.package]
edition = "2024"
rust-version = "1.95"
license = "MIT OR Apache-2.0"
repository = "https://github.com/quazardous/egui-pop"
homepage = "https://github.com/quazardous/egui-pop"
authors = ["The egui-pop contributors"]

# Debuginfo filled 21 GB of target/debug on a full test run: egui-pop's
# own code keeps file and line in backtraces, dependencies none. `test`
# inherits it. A debugger on a dependency: CARGO_PROFILE_DEV_DEBUG=2.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

[workspace.dependencies]
egui-pop-tokens = { version = "0.2.2", path = "crates/egui-pop-tokens" }
ortho-router = { version = "0.1.0", path = "crates/ortho-router" }
serde_json = "1"
serde = { version = "1", features = ["derive"] }
# MIT OR Apache-2.0: token and kit files may be written in YAML (comments).
serde-saphyr = { version = "2", default-features = false, features = ["deserialize"] }
log = "0.4"
# MIT OR Apache-2.0: links parsed and their hosts shown in Unicode and
# punycode (`egui_pop_model::links`); already in the tree through
# eframe's `links` (webbrowser).
url = "2.5"
idna = "1"
egui-pop-model = { version = "0.4.1", path = "crates/egui-pop-model" }
# Without its default fonts: the facade's `bundled-fonts` turns them on,
# so an application can leave them out.
egui-pop-core = { version = "0.6.0", path = "crates/egui-pop-core", default-features = false }
egui-pop-api = { version = "0.6.0", path = "crates/egui-pop-api", default-features = false }
egui-pop-test = { version = "0.6.0", path = "crates/egui-pop-test" }
egui-pop-test-macros = { version = "0.1.0", path = "crates/egui-pop-test-macros" }
egui-pop-viewport = { version = "0.6.0", path = "crates/egui-pop-viewport" }
egui-pop-i18n = { version = "0.6.0", path = "crates/egui-pop-i18n" }
egui-pop-platform = { version = "0.6.0", path = "crates/egui-pop-platform", default-features = false }
egui-pop-win32 = { version = "0.2.1", path = "crates/egui-pop-win32" }
egui-pop-wayland = { version = "0.2.0", path = "crates/egui-pop-wayland" }
egui-pop-views = { version = "0.6.0", path = "crates/egui-pop-views" }
egui-pop-editors = { version = "0.6.0", path = "crates/egui-pop-editors", default-features = false }
egui-pop-imaging = { version = "0.6.0", path = "crates/egui-pop-imaging" }
egui = { version = "0.37", default-features = false }
# MIT OR Apache-2.0: the scopes egui, egui-wgpu and wgpu already use;
# compiled out unless a profiler backend is chosen (docs/threading.md).
profiling = { version = "1", default-features = false }
egui_kittest = "0.37"
# MIT OR Apache-2.0: the test kit shares one wgpu device per process.
egui-wgpu = { version = "0.37", default-features = false }
# MIT OR Apache-2.0 (the Phosphor icons themselves are MIT). A fork of
# egui-phosphor carrying its pending update to egui 0.37
# (amPerl/egui-phosphor#49), published under its own name until upstream
# releases; its library is still `egui_phosphor`.
egui-phosphor = { package = "egui-pop-phosphor", version = "0.15", default-features = false, features = ["regular"] }
eframe = { version = "0.37", default-features = false }
# MIT OR Apache-2.0 (its rmp-serde and rmp are MIT): the protocol and
# plugin behind eframe's `inspection`, which `egui-mcp` drives; the
# gallery's `inspection` feature and its smoke test only.
egui_inspection = { version = "0.37", default-features = false }
# MIT; the system's file chooser (xdg portal on Linux).
rfd = "0.17"
# MIT OR Apache-2.0: PNG and JPEG decoded for the file picker's previews
# (eframe and egui_kittest already depend on it).
image = { version = "0.25", default-features = false }
# MIT: docked tabs and splits for the workbench's areas. egui_stack
# continues egui_dock 0.21 on egui 0.37.
# 0.22.1 has the `DockPainter` the kit paints the docks with; 0.22.2 the
# section stacks egui-pop wraps (`sections`).
egui_stack = { version = "0.22.3", default-features = false }
egui-pop = { version = "0.6.0", path = "crates/egui-pop" }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
