[workspace]
resolver = "3"
members = [
    "crates/egui-pop-tokens",
    "crates/egui-pop-win32",
    "crates/egui-pop-wayland",
    "crates/egui-pop-model",
    "crates/egui-pop-core",
    "crates/egui-pop-api",
    "crates/egui-pop-viewport",
    "crates/egui-pop-i18n",
    "crates/egui-pop-platform",
    "crates/egui-pop-views",
    "crates/egui-pop-editors",
    "crates/egui-pop-imaging",
    "crates/egui-pop-test",
    "crates/egui-pop",
    "crates/egui-pop-gallery",
    "crates/consumer-smoke",
    "templates/extension",
    "xtask",
]

[workspace.package]
edition = "2024"
rust-version = "1.95"
license = "MIT OR Apache-2.0"
repository = "https://github.com/quazardous/egui-pop"
homepage = "https://github.com/quazardous/egui-pop"
authors = ["The egui-pop contributors"]

# Debuginfo filled 21 GB of target/debug on a full test run: egui-pop's
# own code keeps file and line in backtraces, dependencies none. `test`
# inherits it. A debugger on a dependency: CARGO_PROFILE_DEV_DEBUG=2.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

[workspace.dependencies]
egui-pop-tokens = { version = "0.1.1", path = "crates/egui-pop-tokens" }
serde_json = "1"
serde = { version = "1", features = ["derive"] }
# MIT OR Apache-2.0: token and kit files may be written in YAML (comments).
serde-saphyr = { version = "2", default-features = false, features = ["deserialize"] }
log = "0.4"
egui-pop-model = { version = "0.1.1", path = "crates/egui-pop-model" }
egui-pop-core = { version = "0.1.1", path = "crates/egui-pop-core" }
egui-pop-api = { version = "0.1.1", path = "crates/egui-pop-api", default-features = false }
egui-pop-test = { version = "0.1.1", path = "crates/egui-pop-test" }
egui-pop-viewport = { version = "0.1.1", path = "crates/egui-pop-viewport" }
egui-pop-i18n = { version = "0.1.1", path = "crates/egui-pop-i18n" }
egui-pop-platform = { version = "0.1.1", path = "crates/egui-pop-platform", default-features = false }
egui-pop-win32 = { version = "0.1.1", path = "crates/egui-pop-win32" }
egui-pop-wayland = { version = "0.1.1", path = "crates/egui-pop-wayland" }
egui-pop-views = { version = "0.1.1", path = "crates/egui-pop-views" }
egui-pop-editors = { version = "0.1.1", path = "crates/egui-pop-editors", default-features = false }
egui-pop-imaging = { version = "0.1.1", path = "crates/egui-pop-imaging" }
egui = { version = "0.37", default-features = false }
# MIT OR Apache-2.0: the scopes egui, egui-wgpu and wgpu already use;
# compiled out unless a profiler backend is chosen (docs/threading.md).
profiling = { version = "1", default-features = false }
egui_kittest = "0.37"
# MIT OR Apache-2.0: the test kit shares one wgpu device per process.
egui-wgpu = { version = "0.37", default-features = false }
# MIT OR Apache-2.0 (the Phosphor icons themselves are MIT).
egui-phosphor = { version = "0.14", default-features = false, features = ["regular"] }
eframe = { version = "0.37", default-features = false }
# MIT; the system's file chooser (xdg portal on Linux).
rfd = "0.17"
# MIT: docked tabs and splits for the workbench's areas.
egui_dock = { version = "0.21", default-features = false }
egui-pop = { version = "0.1.1", path = "crates/egui-pop" }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

# Temporary: egui_dock and egui-phosphor have no release on egui 0.37 yet,
# so both come from a git branch updating them to 0.37. crates.io refuses
# git dependencies: egui-pop cannot be published while these patches
# remain. Each goes as soon as its crate is released on egui 0.37 (then
# raise the requirement above if the version changed, and drop the patch).
[patch.crates-io]
# The update offered to egui_dock (based on its 0.21 release line).
egui_dock = { git = "https://github.com/quazardous/egui_dock", branch = "update-egui-0.37" }
# egui-phosphor's open pull request updating it to egui 0.37.
egui-phosphor = { git = "https://github.com/xangelix/egui-phosphor", branch = "egui-0.37" }
