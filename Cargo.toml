[workspace]
resolver = "3"
members = [
    "crates/egui-pop-tokens",
    "crates/egui-pop-model",
    "crates/egui-pop-core",
    "crates/egui-pop-api",
    "crates/egui-pop-test",
    "crates/egui-pop",
    "crates/egui-pop-gallery",
    "crates/consumer-smoke",
]

[workspace.package]
edition = "2024"
rust-version = "1.95"
license = "MIT"
repository = "https://github.com/quazardous/egui-pop"
authors = ["The egui-pop contributors"]

[workspace.dependencies]
egui-pop-tokens = { version = "0.0.1", path = "crates/egui-pop-tokens" }
serde_json = "1"
serde = { version = "1", features = ["derive"] }
log = "0.4"
egui-pop-model = { version = "0.0.1", path = "crates/egui-pop-model" }
egui-pop-core = { version = "0.0.1", path = "crates/egui-pop-core" }
egui-pop-api = { version = "0.0.1", path = "crates/egui-pop-api", default-features = false }
egui-pop-test = { version = "0.0.1", path = "crates/egui-pop-test" }
egui = { version = "0.36", default-features = false }
egui_kittest = "0.36"
# MIT OR Apache-2.0 (the Phosphor icons themselves are MIT).
egui-phosphor = { version = "0.14", default-features = false, features = ["regular"] }
eframe = { version = "0.36", default-features = false }
egui-pop = { version = "0.0.1", path = "crates/egui-pop" }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
