# cargo-deny: licences, advisories, bans and sources of the dependency tree.
# Run with `cargo deny check`.

[graph]
# Test-only tools (snapshot diffing in egui_kittest) are not shipped.
exclude-dev = true
# The platforms egui-pop builds for. Code only for others (wry's Android
# part, for one) is never compiled and is not checked.
targets = [
    "x86_64-unknown-linux-gnu",
    "aarch64-unknown-linux-gnu",
    "x86_64-pc-windows-msvc",
    "aarch64-pc-windows-msvc",
    "x86_64-apple-darwin",
    "aarch64-apple-darwin",
    "wasm32-unknown-unknown",
]

[advisories]
# Unmaintained crates are reported for direct dependencies only.
unmaintained = "workspace"
yanked = "warn"
ignore = []

[licenses]
# Permissive licences only: no GPL, LGPL or MPL can enter the tree (a
# crate offering one of them among other choices is taken under the
# permissive one).
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "0BSD",
    "Zlib",
    "ISC",
    "Unicode-3.0",
]
confidence-threshold = 0.9
unused-allowed-license = "allow"

# egui's bundled fonts, used by the gallery: fonts under their own licences.
[[licenses.exceptions]]
crate = "epaint_default_fonts"
allow = ["OFL-1.1", "Ubuntu-font-1.0"]

# egui-pop's own bundled fonts (Inter, JetBrains Mono NL, feature
# `bundled-fonts`): the code stays MIT or Apache-2.0, the fonts are under
# their own licence, its text shipped next to them.
[[licenses.exceptions]]
crate = "egui-pop-core"
allow = ["OFL-1.1"]

# The Windows clipboard backend of eframe (the gallery only), under the
# permissive Boost licence.
[[licenses.exceptions]]
crate = "clipboard-win"
allow = ["BSL-1.0"]

[[licenses.exceptions]]
crate = "error-code"
allow = ["BSL-1.0"]

# The StatusNotifierItem client behind tray-icon on Linux (the tray of
# egui-pop-platform), dedicated to the public domain.
[[licenses.exceptions]]
crate = "ksni"
allow = ["Unlicense"]

# The webview trial (feature `views-webview`, off by default, Linux only):
# wry finds its data folder through `dirs`, whose `dirs-sys` uses
# `option-ext` (MPL-2.0). MPL-2.0 is copyleft per file: the crate is used
# unmodified and none of egui-pop's code falls under it. Accepted by the
# lead maintainer for this crate only; any other MPL crate is still refused.
[[licenses.exceptions]]
crate = "option-ext"
allow = ["MPL-2.0"]

[licenses.private]
# The gallery is not published.
ignore = true

[bans]
# wgpu and winit pull several versions of a few platform crates.
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
# Temporary, until an egui-phosphor on egui 0.37 is on crates.io: the
# fork patched in the workspace's Cargo.toml (issue #146).
allow-git = [
    "https://github.com/quazardous/egui-phosphor",
]
