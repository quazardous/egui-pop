# cargo-deny: licences, advisories, bans and sources of the dependency tree.
# Run with `cargo deny check`.

[graph]
# Test-only tools (snapshot diffing in egui_kittest) are not shipped.
exclude-dev = true

[advisories]
# Unmaintained crates are reported for direct dependencies only.
unmaintained = "workspace"
yanked = "warn"
ignore = []

[licenses]
# Permissive licences only: no GPL, LGPL or MPL can enter the tree (a
# crate offering one of them among other choices is taken under the
# permissive one).
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "0BSD",
    "Zlib",
    "ISC",
    "Unicode-3.0",
]
confidence-threshold = 0.9
unused-allowed-license = "allow"

# egui's bundled fonts, used by the gallery: fonts under their own licences.
[[licenses.exceptions]]
crate = "epaint_default_fonts"
allow = ["OFL-1.1", "Ubuntu-font-1.0"]

# The Windows clipboard backend of eframe (the gallery only), under the
# permissive Boost licence.
[[licenses.exceptions]]
crate = "clipboard-win"
allow = ["BSL-1.0"]

[[licenses.exceptions]]
crate = "error-code"
allow = ["BSL-1.0"]

# The StatusNotifierItem client behind tray-icon on Linux (the tray of
# egui-pop-platform), dedicated to the public domain.
[[licenses.exceptions]]
crate = "ksni"
allow = ["Unlicense"]

[licenses.private]
# The gallery is not published.
ignore = true

[bans]
# wgpu and winit pull several versions of a few platform crates.
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
