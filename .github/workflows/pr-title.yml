name: Pull request title

# A squash merge makes the title the commit's subject: it follows
# Conventional Commits (CONTRIBUTING.md, "Commit subjects"). Its own
# workflow, so that editing the title checks it again without running CI.
# Every pull request, our own included (pr-lint.yml checks the title too,
# on each push; this one answers an edited title).
on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read

jobs:
  title:
    name: Pull request title
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - env:
          TITLE: ${{ github.event.pull_request.title }}
        run: tools/pr-title.sh "$TITLE"
