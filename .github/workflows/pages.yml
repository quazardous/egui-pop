name: Gallery and docs on the web

# Builds the docs as an mdBook (book.toml) and checks their links
# (tools/book/links.py), builds the gallery for the web with Trunk, loads
# it in headless Chrome (tools/web-smoke.mjs), and deploys both to GitHub
# Pages: the gallery at the site's root, the docs under /docs/. Pages must
# be enabled for the repository with "GitHub Actions" as the source; until
# the repository variable PAGES is set to `on`, it only runs by hand. Run
# by hand on another branch, it builds and tests without deploying.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    if: github.event_name == 'workflow_dispatch' || vars.PAGES == 'on'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.95"
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: trunk,mdbook@0.5.4
      - name: Build the docs and check their links
        run: |
          mdbook build
          python3 tools/book/links.py target/book
      - name: Build the gallery
        working-directory: crates/egui-pop-gallery
        run: trunk build --release --public-url /${{ github.event.repository.name }}/
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Smoke test in headless Chrome
        run: >-
          node tools/web-smoke.mjs crates/egui-pop-gallery/dist
          --base /${{ github.event.repository.name }}/
          --screenshot web-smoke.png
      - name: Upload the smoke test's screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: web-smoke
          path: web-smoke.png
          if-no-files-found: ignore
      - name: Add the docs to the site
        run: cp -r target/book crates/egui-pop-gallery/dist/docs
      - uses: actions/upload-pages-artifact@v3
        with:
          path: crates/egui-pop-gallery/dist

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main' && (github.event_name == 'workflow_dispatch' || vars.PAGES == 'on')
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
