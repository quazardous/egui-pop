name: Gallery and docs on the web

# Builds the docs as an mdBook (book.toml) and checks their links
# (tools/book/links.py), builds the workspace's API documentation with
# every feature (docs.rs documents the default features only), builds the
# gallery for the web with Trunk, loads it in headless Chrome
# (tools/web-smoke.mjs), and deploys them to GitHub Pages: a static
# landing page at the site's root (tools/site/index.html, with a few of
# the gallery's snapshots; its links checked by tools/site/links.py), the
# gallery under /gallery/, the docs under /docs/, the API under /api/. Pages must
# be enabled for the repository with "GitHub Actions" as the source; until
# the repository variable PAGES is set to `on`, it only runs by hand. Run
# by hand on another branch, it builds and tests without deploying.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    if: github.event_name == 'workflow_dispatch' || vars.PAGES == 'on'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.95"
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: trunk,mdbook@0.5.4
      - name: Build the docs and check their links
        run: |
          mdbook build
          python3 tools/book/summary.py
          python3 tools/book/links.py target/book
      # Every feature, so the facade's optional crates and each crate's
      # optional modules are documented; Windows-only crates document
      # their stubs. The tools and the gallery, unpublished, are left out.
      - name: Build the API documentation
        run: >-
          cargo doc --workspace --no-deps --all-features --locked
          --exclude xtask --exclude consumer-smoke
          --exclude egui-pop-gallery --exclude egui-pop-extension-template
      - name: Build the gallery
        working-directory: crates/egui-pop-gallery
        run: trunk build --release --public-url /${{ github.event.repository.name }}/gallery/
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Smoke test in headless Chrome
        run: >-
          node tools/web-smoke.mjs crates/egui-pop-gallery/dist
          --base /${{ github.event.repository.name }}/gallery/
          --screenshot web-smoke.png
      - name: Upload the smoke test's screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: web-smoke
          path: web-smoke.png
          if-no-files-found: ignore
      # The landing page at the root, its images from the gallery's
      # snapshots and the logo, then the gallery, the docs and the API.
      - name: Assemble the site and check the landing page's links
        run: |
          mkdir -p target/site/img
          cp tools/site/index.html target/site/index.html
          cp docs/logo/egui-pop.svg target/site/img/
          for shot in overview-pop-dark overview-pop-light workbench-pop-dark \
                      preview-dialog-pop-dark node-graph-pop-dark theme-editor-pop-dark; do
            cp "crates/egui-pop-gallery/tests/snapshots/$shot.png" target/site/img/
          done
          cp -r crates/egui-pop-gallery/dist target/site/gallery
          cp -r target/book target/site/docs
          cp -r target/doc target/site/api
          rm -f target/site/api/.lock
          cp tools/book/api-index.html target/site/api/index.html
          python3 tools/site/links.py target/site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: target/site

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main' && (github.event_name == 'workflow_dispatch' || vars.PAGES == 'on')
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
