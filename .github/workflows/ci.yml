name: CI

on:
  push:
    # `next` is the buffer branch: pull requests merge there on the quick
    # checks, every push to it runs everything, and `main` fast-forwards to
    # it once that is green (promote.yml; docs/testing.md, "The next branch").
    branches: [main, next]
  pull_request:
    # `labeled`: adding the ci:full label runs everything at once, and
    # the internal label lets the changeset check pass.
    types: [opened, synchronize, reopened, labeled]

# One run per push to `next`: a newer push cancels the running one, so a
# batch of merges is checked once. Pull requests and `main` are not cancelled.
concurrency:
  group: ci-${{ github.event_name == 'push' && github.ref == 'refs/heads/next' && 'next' || github.run_id }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings
  RUSTDOCFLAGS: -D warnings
  # The minimum supported Rust version; also the toolchain CI checks with.
  RUST_TOOLCHAIN: "1.95"
  # knope, which raises the versions from the changesets (knope.toml).
  KNOPE_VERSION: "0.23.2"

jobs:
  # What the change needs (docs/testing.md, "Selection"): every other job
  # runs only when a file it checks changed. Pushes to main and pull
  # requests labelled ci:full run everything.
  changes:
    name: Changes
    runs-on: ubuntu-24.04
    outputs:
      full: ${{ steps.affected.outputs.full }}
      fmt: ${{ steps.affected.outputs.fmt }}
      clippy: ${{ steps.affected.outputs.clippy }}
      doc: ${{ steps.affected.outputs.doc }}
      book: ${{ steps.affected.outputs.book }}
      test: ${{ steps.affected.outputs.test }}
      deny: ${{ steps.affected.outputs.deny }}
      wasm: ${{ steps.affected.outputs.wasm }}
      package: ${{ steps.affected.outputs.package }}
      semver: ${{ steps.affected.outputs.semver }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: xtask
      - id: affected
        env:
          FULL: ${{ github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'ci:full') }}
          BASE: ${{ github.event.pull_request.base.sha }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          if [ "$FULL" = true ]; then
            cargo xtask affected --full --github
          else
            cargo xtask affected --base "$BASE" --github
          fi
          # A pull request into `next` gets the quick checks only (format,
          # clippy, the guides' docs, licences, changesets, title): the
          # long jobs run on `next` itself once it is merged. The last value
          # written to GITHUB_OUTPUT wins.
          if [ "$FULL" != true ] && [ "$BASE_REF" = next ]; then
            for job in test book wasm package semver; do
              echo "$job=false" >> "$GITHUB_OUTPUT"
            done
            echo "Into next: quick checks only; tests, docs site, wasm, packaging and semver run on next."
          fi

  fmt:
    name: Format
    needs: changes
    if: needs.changes.outputs.fmt == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: rustfmt
      - run: cargo fmt --all --check

  clippy:
    name: Clippy
    needs: changes
    if: needs.changes.outputs.clippy == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      # The gallery's `inspection` feature (eframe's), off by default:
      # its smoke test runs in the default build (tests/inspection.rs).
      - run: cargo clippy -p egui-pop-gallery --all-targets --locked --features inspection -- -D warnings
      # The system's file chooser, a fallback off by default: linted, never
      # tested with (its tests would only check that it is refused).
      - run: cargo clippy -p egui-pop-api -p egui-pop-gallery --all-targets --locked --features egui-pop-api/native-dialogs,egui-pop-gallery/native-dialogs -- -D warnings
      - run: cargo doc --workspace --no-deps --locked

  # The guides compiled as documentation, when only they changed (clippy
  # documents the whole workspace otherwise).
  doc:
    name: Guides' documentation
    needs: changes
    if: needs.changes.outputs.doc == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - uses: Swatinem/rust-cache@v2
      - run: cargo doc -p consumer-smoke --no-deps --locked

  # The docs site (book.toml), as the Pages workflow builds it: a broken
  # link or a page of the index missing from the table of contents fails
  # the pull request, not only the deploy.
  book:
    name: Docs site
    needs: changes
    if: needs.changes.outputs.book == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: taiki-e/install-action@v2
        with:
          tool: mdbook@0.5.4
      - run: python3 tools/book/summary.py
      - run: mdbook build
      - run: python3 tools/book/links.py target/book

  test:
    name: Tests (lavapipe ${{ matrix.shard }}/3)
    needs: changes
    if: needs.changes.outputs.test == 'true'
    runs-on: ubuntu-24.04
    # The tests split in three by nextest (`--partition hash:N/3`), run side
    # by side: about 16 minutes of tests become about 6 per shard. Each
    # shard builds the tests (about 3 minutes, from the shared cache) and
    # runs the doctests.
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    env:
      # Render with Mesa's software Vulkan driver: the same pixels on every run.
      WGPU_BACKEND: vulkan
      # No system file chooser in any test (`files::TEST_ENV`), whatever
      # the features.
      EGUI_POP_TEST: "1"
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      # The runner's disk runs out on a full test build ("No space left on
      # device"): drop preinstalled SDKs this job never uses, about 20 GB.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /usr/local/.ghcup /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          df -h /
      - name: Install lavapipe
        run: |
          # The runners' Azure mirror of the Ubuntu archive may not resolve:
          # the main archive instead, and retries.
          sudo sed -i 's|http://azure.archive.ubuntu.com|http://archive.ubuntu.com|g' /etc/apt/sources.list.d/ubuntu.sources
          sudo apt-get -o Acquire::Retries=5 update
          sudo apt-get -o Acquire::Retries=5 install -y mesa-vulkan-drivers
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest
      - uses: Swatinem/rust-cache@v2
      # The tests the change needs, critical tests included; everything
      # on main (docs/testing.md).
      - name: Tests
        env:
          FULL: ${{ needs.changes.outputs.full }}
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ "$FULL" = true ]; then
            cargo xtask affected --full --run -- --profile ci --partition hash:${{ matrix.shard }}/3
          else
            cargo xtask affected --base "$BASE" --run -- --profile ci --partition hash:${{ matrix.shard }}/3
          fi
      - name: Upload the test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-${{ matrix.shard }}
          path: target/nextest/ci/junit-*.xml
          if-no-files-found: ignore
      - name: Upload snapshot differences
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: snapshot-diffs-${{ matrix.shard }}
          path: |
            **/tests/snapshots/*.diff.png
            **/tests/snapshots/*.new.png
          if-no-files-found: ignore

  # The video widget and the viewer's video page (feature `video`), the one
  # build needing GStreamer: the other jobs build without it. It tests on a
  # clip it writes itself, so the plugins are there for the test sources, the
  # AVI muxer and demuxer.
  video:
    name: Viewer's video (GStreamer)
    needs: changes
    if: needs.changes.outputs.test == 'true'
    runs-on: ubuntu-24.04
    env:
      WGPU_BACKEND: vulkan
    steps:
      - uses: actions/checkout@v5
      - name: Install GStreamer and lavapipe
        run: |
          # The runners' Azure mirror of the Ubuntu archive may not resolve:
          # the main archive instead, and retries.
          sudo sed -i 's|http://azure.archive.ubuntu.com|http://archive.ubuntu.com|g' /etc/apt/sources.list.d/ubuntu.sources
          sudo apt-get -o Acquire::Retries=5 update
          sudo apt-get -o Acquire::Retries=5 install -y mesa-vulkan-drivers \
            libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev \
            gstreamer1.0-plugins-base gstreamer1.0-plugins-good
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: video
      - run: cargo clippy -p egui-pop-views -p egui-pop-gallery -p egui-pop --all-targets --locked --features egui-pop-views/video,egui-pop-gallery/video,egui-pop/views-video -- -D warnings
      - run: cargo doc -p egui-pop-views -p egui-pop --no-deps --locked --features egui-pop-views/video,egui-pop/views-video
      - run: cargo test -p egui-pop-views --locked --features video --lib -- viewer video
      - run: cargo test -p egui-pop-views --locked --features video --test video --test video_gstreamer --test viewer_video --test viewer_gstreamer
      - run: cargo test -p egui-pop-gallery --locked --features video --test viewer_video
      - name: Upload snapshot differences
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: video-snapshot-diffs
          path: |
            **/tests/snapshots/*.diff.png
            **/tests/snapshots/*.new.png
          if-no-files-found: ignore

  # The viewer's YouTube page (feature `webview`), the one build needing
  # WebKitGTK: the other jobs build without it. Its tests use a pretend web
  # view and run in the test job; here the wry backend builds and is linted.
  webview:
    name: Viewer's web view (WebKitGTK)
    needs: changes
    if: needs.changes.outputs.test == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Install WebKitGTK's development packages
        run: |
          # The runners' Azure mirror of the Ubuntu archive may not resolve:
          # the main archive instead, and retries.
          sudo sed -i 's|http://azure.archive.ubuntu.com|http://archive.ubuntu.com|g' /etc/apt/sources.list.d/ubuntu.sources
          sudo apt-get -o Acquire::Retries=5 update
          sudo apt-get -o Acquire::Retries=5 install -y libwebkit2gtk-4.1-dev
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: webview
      - run: cargo clippy -p egui-pop-views -p egui-pop-gallery -p egui-pop --all-targets --locked --features egui-pop-views/webview,egui-pop-gallery/webview,egui-pop/views-webview -- -D warnings
      - run: cargo doc -p egui-pop-views -p egui-pop --no-deps --locked --features egui-pop-views/webview,egui-pop/views-webview
      - run: cargo test -p egui-pop-views --locked --features webview --lib viewer
      - run: cargo test -p egui-pop-views --locked --features webview --test viewer_embed

  deny:
    name: Licences and advisories
    needs: changes
    if: needs.changes.outputs.deny == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny
      - run: cargo deny check

  wasm:
    name: Gallery for the web
    needs: changes
    if: needs.changes.outputs.wasm == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: trunk
      - name: Build
        working-directory: crates/egui-pop-gallery
        run: trunk build --release --locked
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # The gallery starts in headless Chrome (WebGL through SwiftShader)
      # without a panic.
      - name: Smoke test in headless Chrome
        run: node tools/web-smoke.mjs crates/egui-pop-gallery/dist --screenshot web-smoke.png
      - name: Upload the smoke test's screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: web-smoke
          path: web-smoke.png
          if-no-files-found: ignore

  package:
    name: Packaging (dry run)
    needs: changes
    if: needs.changes.outputs.package == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      # Every published crate packages with its metadata, in dependency
      # order; nothing is uploaded.
      - run: cargo publish --workspace --dry-run --no-verify --locked

  # A pull request changing a published crate adds a changeset, unless it
  # is labelled internal; the pending changesets are consistent
  # (docs/releasing.md).
  changeset:
    name: Changesets
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: xtask
      - env:
          BASE: ${{ github.event.pull_request.base.sha }}
          INTERNAL: ${{ contains(github.event.pull_request.labels.*.name, 'internal') }}
        run: |
          if [ "$INTERNAL" = true ]; then
            cargo xtask changeset-check --base "$BASE" --internal
          else
            cargo xtask changeset-check --base "$BASE"
          fi

  # Every published crate against its latest release on crates.io, with
  # the versions the pending changesets lead to: a break passes when its
  # changeset says major (a new minor before 1.0), fails otherwise.
  semver:
    name: Semver checks
    needs: changes
    if: needs.changes.outputs.semver == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      # It documents the features other than unstable ones: `views-video`, whose
      # bindings ask for GStreamer's development packages, and `views-webview`,
      # WebKitGTK's.
      - name: Install GStreamer's and WebKitGTK's development packages
        run: |
          # The runners' Azure mirror of the Ubuntu archive may not resolve:
          # the main archive instead, and retries.
          sudo sed -i 's|http://azure.archive.ubuntu.com|http://archive.ubuntu.com|g' /etc/apt/sources.list.d/ubuntu.sources
          sudo apt-get -o Acquire::Retries=5 update
          sudo apt-get -o Acquire::Retries=5 install -y libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev \
            libwebkit2gtk-4.1-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-semver-checks
      - uses: knope-dev/action@19617851f9f13ab2f27a05989c55efb18aca3675 # v2.1.2
        with:
          version: ${{ env.KNOPE_VERSION }}
      # Raises the versions in this checkout only; nothing is committed.
      - name: The versions the pending changesets lead to
        run: |
          git config user.name ci
          git config user.email ci@invalid
          knope pending-versions
          git status --short
      # A crate not yet on crates.io has no baseline to compare with.
      - run: cargo semver-checks check-release --workspace --exclude egui-pop-agent

  # The one required check: every job above passed or was skipped. A
  # skipped job reports nothing, so branch protection names this one.
  ci:
    name: CI
    if: always()
    needs: [changes, fmt, clippy, doc, book, test, video, webview, deny, wasm, package, changeset, semver]
    runs-on: ubuntu-24.04
    steps:
      - env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "results: $RESULTS"
          for r in $RESULTS; do
            case "$r" in
              success|skipped) ;;
              *) echo "a job ended with: $r"; exit 1 ;;
            esac
          done
