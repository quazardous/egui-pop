name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings
  RUSTDOCFLAGS: -D warnings
  # The minimum supported Rust version; also the toolchain CI checks with.
  RUST_TOOLCHAIN: "1.95"

jobs:
  fmt:
    name: Format
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: rustfmt
      - run: cargo fmt --all --check

  clippy:
    name: Clippy
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo doc --workspace --no-deps --locked

  test:
    name: Tests (lavapipe)
    runs-on: ubuntu-24.04
    env:
      # Render with Mesa's software Vulkan driver: the same pixels on every run.
      WGPU_BACKEND: vulkan
    steps:
      - uses: actions/checkout@v5
      - name: Install lavapipe
        run: |
          sudo apt-get update
          sudo apt-get install -y mesa-vulkan-drivers
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace --locked
      - name: Upload snapshot differences
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: snapshot-diffs
          path: |
            **/tests/snapshots/*.diff.png
            **/tests/snapshots/*.new.png
          if-no-files-found: ignore

  deny:
    name: Licences and advisories
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny
      - run: cargo deny check

  wasm:
    name: Gallery for the web
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: trunk
      - name: Build
        working-directory: crates/egui-pop-gallery
        run: trunk build --release --locked
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # The gallery starts in headless Chrome (WebGL through SwiftShader)
      # without a panic.
      - name: Smoke test in headless Chrome
        run: node tools/web-smoke.mjs crates/egui-pop-gallery/dist --screenshot web-smoke.png
      - name: Upload the smoke test's screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: web-smoke
          path: web-smoke.png
          if-no-files-found: ignore

  package:
    name: Packaging (dry run)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      # Every published crate packages with its metadata, in dependency
      # order; nothing is uploaded.
      - run: cargo publish --workspace --dry-run --no-verify --locked

  semver:
    name: Semver checks
    runs-on: ubuntu-24.04
    # Informative while the crates are at 0.0.x.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-semver-checks
      - run: cargo semver-checks check-release -p egui-pop
