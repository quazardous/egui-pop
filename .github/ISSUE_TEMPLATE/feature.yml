name: Suggestion
description: An idea to make egui-pop or its gallery better.
labels: ["enhancement"]
body:
  - type: textarea
    id: idea
    attributes:
      label: The idea
      description: What you would like, and what it would let you do.
    validations:
      required: true
  - type: textarea
    id: today
    attributes:
      label: How you do it today
      description: A workaround, another library or application that does it well.
    validations:
      required: false
  - type: input
    id: page
    attributes:
      label: Page
      description: The gallery page or the component it is about.
    validations:
      required: false
