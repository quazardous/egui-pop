# `knope document-change`: writes a changeset, asking for the crates,
# their bumps and the text.
[[workflows]]
name = "document-change"

[[workflows.steps]]
type = "CreateChangeFile"

# `knope release`: raises the versions from the changesets and deletes
# them, then `cargo xtask release-notes` writes the release into
# CHANGELOG.md and commits it ("chore(release): ..."). No tag and no
# publishing: those follow the merge, by hand (docs/releasing.md).
[[workflows]]
name = "release"

[[workflows.steps]]
type = "PrepareRelease"

[[workflows.steps]]
type = "Command"
command = "cargo xtask release-notes"

# `knope pending-versions`: the versions the pending changesets lead to,
# written in place and not committed. CI's semver job runs it so that
# a break declared `major` is checked against the version it will ship.
[[workflows]]
name = "pending-versions"

[[workflows.steps]]
type = "PrepareRelease"
allow_empty = true
