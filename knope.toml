# Versions and releases with knope (https://knope.tech), from the
# changesets in `.changeset/` (docs/releasing.md).
#
# One package per published crate, each with its own version: its
# manifest, its requirement in `[workspace.dependencies]` and its entry
# in `Cargo.lock`. The packages have no `changelog`: knope would write
# one section per package without naming it, and two packages released
# at the same version would overwrite each other in a shared file. The
# one CHANGELOG.md is written by `cargo xtask release-notes`, from the
# same changesets, after `PrepareRelease`.
#
# Before 1.0, knope applies a `major` change to the middle number (0.2.x
# to 0.3.0) and `minor` and `patch` to the last one.

[changes]
# Changes come from changesets only. Commit subjects follow Conventional
# Commits (CONTRIBUTING.md), but are not read: a change described by both
# a changeset and a `feat:` commit would be counted twice.
ignore_conventional_commits = true

[packages.egui-pop-tokens]
versioned_files = [
    "crates/egui-pop-tokens/Cargo.toml",
    { path = "Cargo.toml", dependency = "egui-pop-tokens" },
    { path = "Cargo.lock", dependency = "egui-pop-tokens" },
]

